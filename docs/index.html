    done: (S, p) => S.sales.has(p.id),
    validate(V, p) {
      if (!Array.isArray(p.items) || !p.items.length) return new OpError('P3D09', 'Une vente doit contenir au moins un article.');
      for (const i of p.items) {
        if (!isPieceCount(i.quantity)) return new OpError('P3D09', `Quantité invalide pour « ${String(i.item_name || '').trim()} » : ${PIECES_ERROR}`);
        if (toNum(i.unit_price) < 0) return new OpError('P3D09', 'Prix invalide.');
      }
      const reqs = p.items.filter((i) => i.from_stock !== false);
      const res = simulateFifo(V, reqs);
      const k = res.findIndex((r) => r.shortage > 0);
      if (k >= 0) return new OpError('P3D01', `Stock insuffisant pour « ${reqs[k].item_name} » : il manque ${plural(res[k].shortage, 'pièce', 'pièces')}.`);
      return null;
    },
    apply(V, p, ctx) {
      const reqs = p.items.filter((i) => i.from_stock !== false);
      const fifo = simulateFifo(V, reqs);
      let fi = 0;
      let amount = 0;
      let cogs = 0;
      const lots = new Set();
      p.items.forEach((i, pos) => {
        const qty = Math.round(toNum(i.quantity));
        amount += qty * toNum(i.unit_price);
        let itemCogs = 0;
        if (i.from_stock !== false) {
          const f = fifo[fi++];
          for (const a of f.allocations) {
            const aid = uuid();
            V.sale_allocations.set(aid, { id: aid, owner_id: ctx.userId, sale_item_id: i.id, lot_id: a.lot.id, quantity: a.quantity, unit_cost: a.unit_cost, created_at: ctx.now, updated_at: ctx.now });
            itemCogs += a.quantity * a.unit_cost;
            lots.add(a.lot.id);
          }
        } else {
          itemCogs = qty * toNum(i.unit_cost);
        }
        V.sale_items.set(i.id, {
          id: i.id, owner_id: ctx.userId, sale_id: p.id, template_id: i.template_id || null, item_name: String(i.item_name).trim(), quantity: qty,
          unit_price: toNum(i.unit_price), from_stock: i.from_stock !== false, unit_cost: roundDb(itemCogs / qty, 4), cogs: roundDb(itemCogs, 4),
          position: pos, created_at: ctx.now, updated_at: ctx.now,
        });
        cogs += itemCogs;
      });
      const sale = {
        id: p.id, owner_id: ctx.userId, channel: p.channel || 'direct', customer: p.customer || null, note: p.note || null,
        amount: roundDb(amount + toNum(p.shipping_charged), 2), shipping_charged: toNum(p.shipping_charged), shipping_cost: toNum(p.shipping_cost),
        packaging_cost: toNum(p.packaging_cost), platform_fee: toNum(p.platform_fee), cogs: roundDb(cogs, 4),
        occurred_at: p.occurred_at || ctx.now, created_at: ctx.now, updated_at: ctx.now,
      };
      sale.net_margin = roundDb(sale.amount - sale.cogs - sale.shipping_cost - sale.packaging_cost - sale.platform_fee, 4);
      V.sales.set(p.id, sale);
      for (const id of lots) recomputeLot(V, id);
    },
  },

  'sale.delete': {
    label: () => 'Annulation de vente',
    isDelete: true,
    keys: () => [],
    apply(V, p) {
      V.sales.delete(p.id);
      const lots = new Set();
      for (const i of valuesOf(V.sale_items)) {
        if (i.sale_id !== p.id) continue;
        V.sale_items.delete(i.id);
        for (const a of valuesOf(V.sale_allocations)) {
          if (a.sale_item_id === i.id) {
            V.sale_allocations.delete(a.id);
            lots.add(a.lot_id);
          }
        }
      }
      for (const id of lots) recomputeLot(V, id);
    },
  },
};

function opLabel(op) {
  const def = OPS[op.type];
  try {
    return def ? def.label(op.payload) : op.type;
  } catch {
    return op.type;
  }
}

function cloneState(S) {
  const V = {};
  for (const t of TABLES) V[t] = new Map(S[t]);
  return V;
}

function buildView(S, Q, ctx) {
  const V = cloneState(S);
  V.userId = ctx.userId;
  V.pending = new Set();
  V.failedOps = [];
  V.pendingCount = 0;
  for (const op of Q) {
    const def = OPS[op.type];
    if (!def) continue;
    if (op.status === 'failed') {
      V.failedOps.push(op);
      continue;
    }
    V.pendingCount++;
    try {
      if (def.done && def.done(S, op.payload)) continue;
      def.apply(V, op.payload, ctx);
      for (const k of def.keys(op.payload, ctx)) V.pending.add(k);
    } catch (e) {
      console.warn('[paulo3d] action locale impossible à rejouer', op.type, e);
    }
  }
  return V;
}

/* ---------- stockage sur l'appareil (IndexedDB) ---------- */
const IDB = {
  open(name, { onVersionChange } = {}) {
    return new Promise((resolve, reject) => {
      if (!globalThis.indexedDB) return reject(new Error('IndexedDB indisponible'));
      const req = indexedDB.open(name, 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => {
        const db = req.result;
        // un autre onglet veut effacer cette base : on la libère au lieu de bloquer son démarrage
        db.onversionchange = () => {
          db.close();
          if (onVersionChange) onVersionChange();
        };
        resolve(db);
      };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('IndexedDB bloquée'));
    });
  },
  run(db, mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', mode);
      const store = tx.objectStore('kv');
      let result;
      try {
        result = fn(store);
      } catch (e) {
        tx.abort();
        reject(e);
        return;
      }
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction annulée'));
    });
  },
  get(db, key) {
    return new Promise((resolve, reject) => {
      const req = db.transaction('kv', 'readonly').objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  getPrefix(db, prefix) {
    return new Promise((resolve, reject) => {
      const range = IDBKeyRange.bound(prefix, `${prefix}￿`);
      const req = db.transaction('kv', 'readonly').objectStore('kv').getAll(range);
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  setMany(db, entries) {
    return IDB.run(db, 'readwrite', (store) => {
      for (const [k, v] of entries) store.put(v, k);
    });
  },
  delMany(db, keys) {
    return IDB.run(db, 'readwrite', (store) => {
      for (const k of keys) store.delete(k);
    });
  },
  clearAll(name) {
    return new Promise((resolve) => {
      const req = indexedDB.deleteDatabase(name);
      req.onsuccess = req.onerror = req.onblocked = () => resolve();
    });
  },
};

const channel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('paulo3d') : null;

// Colonnes numériques (le temps réel peut les envoyer en texte) et colonnes calculées par la base
const NUMERIC_FIELDS = {
  settings: ['machine_rate', 'labor_rate', 'filament_price_kg', 'price_coef', 'target_margin_pct', 'spool_low_g', 'spool_critical_g'],
  machines: ['hourly_rate'],
  spools: ['price', 'initial_weight_g', 'tare_g', 'remaining_weight_g', 'cost_per_g'],
  templates: ['pieces_per_print', 'purge_g', 'hardware_cost', 'print_time_min', 'labor_min', 'price_coef', 'target_margin_pct', 'catalog_price'],
  productions: ['quantity', 'failed_pct', 'machine_rate', 'labor_rate', 'grams_total', 'purge_g_total', 'print_time_min_total', 'labor_min_total', 'material_cost', 'purge_cost', 'hardware_cost', 'machine_cost', 'labor_cost', 'total_cost', 'unit_cost'],
  spool_movements: ['delta_g', 'measured_g'],
  production_stock: ['unit_cost', 'quantity', 'qty_available'],
  stock_adjustments: ['quantity', 'unit_cost'],
  sales: ['amount', 'shipping_charged', 'shipping_cost', 'packaging_cost', 'platform_fee', 'cogs', 'net_margin'],
  sale_items: ['quantity', 'unit_price', 'unit_cost', 'cogs', 'position'],
  sale_allocations: ['quantity', 'unit_cost'],
};

function normalizeRow(table, row) {
  const r = { ...row };
  for (const f of NUMERIC_FIELDS[table] || []) {
    if (typeof r[f] === 'string' && r[f].trim() !== '' && Number.isFinite(Number(r[f]))) r[f] = Number(r[f]);
  }
  // colonnes générées : absentes des évènements temps réel, on les recalcule comme la base
  if (table === 'spools') r.cost_per_g = toNum(r.initial_weight_g) > 0 ? roundDb(toNum(r.price) / toNum(r.initial_weight_g), 6) : 0;
  if (table === 'sales') r.net_margin = roundDb(toNum(r.amount) - toNum(r.cogs) - toNum(r.shipping_cost) - toNum(r.packaging_cost) - toNum(r.platform_fee), 4);
  return r;
}

const sameRow = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const TOMBSTONE_MS = 10 * 60000;

const Store = {
  db: null,
  dbName: null,
  volatile: false,
  userId: null,
  S: emptyState(),
  Q: [],
  V: buildView(emptyState(), [], { userId: null, now: new Date().toISOString() }),
  meta: { lastPull: {}, lastReconcile: 0 },
  metaDirty: false,
  listeners: new Set(),
  dirty: new Set(),
  tombstones: new Map(),
  receivedAt: new Map(),
  rev: 0,
  lastSig: null,
  seq: 0,
  persistError: null,

  async open(scope, userId) {
    this.close();
    this.userId = userId;
    this.dbName = `paulo3d:${scope}`;
    this.S = emptyState();
    this.Q = [];
    this.meta = { lastPull: {}, lastReconcile: 0 };
    this.tombstones = new Map();
    this.receivedAt = new Map();
    this.persistError = null;
    try {
      this.db = await IDB.open(this.dbName, {
        onVersionChange: () => {
          this.db = null;
          setTimeout(() => location.reload(), 300);
        },
      });
      this.volatile = false;
      const lastPull = {};
      for (const t of TABLES) {
        const rows = await IDB.get(this.db, `snap:${t}`);
        if (Array.isArray(rows)) for (const r of rows) this.S[t].set(r[PK(t)], normalizeRow(t, r));
        const pos = await IDB.get(this.db, `pull:${t}`);
        if (pos) lastPull[t] = pos;
      }
      // ancienne file (un seul tableau) → une entrée par action
      const legacy = await IDB.get(this.db, 'outbox');
      if (Array.isArray(legacy)) {
        await IDB.setMany(this.db, legacy.map((op, k) => [`op:${op.id}`, { ...op, seq: op.seq || k + 1 }]));
        await IDB.delMany(this.db, ['outbox']);
      }
      await this.reloadQueue();
      const meta = (await IDB.get(this.db, 'meta')) || {};
      // anciennes copies : repères dans « meta » (seulement pour les tables qui n'ont pas encore le leur)
      this.meta = { ...this.meta, ...meta, lastPull: { ...(meta.lastPull || {}), ...lastPull } };
    } catch (e) {
      console.warn('[paulo3d] stockage local indisponible', e);
      this.db = null;
      this.volatile = true;
    }
    this.rebuild(true);
  },

  close() {
    try {
      if (this.db) this.db.close();
    } catch { /* déjà fermée */ }
    this.db = null;
  },

  ctx() {
    return { userId: this.userId, now: new Date().toISOString() };
  },

  // Recalcule l'affichage seulement si les données ou la file d'envoi ont changé
  rebuild(force = false) {
    const sig = `${this.userId}|${this.rev}|${this.Q.map((o) => `${o.id}:${o.status === 'failed' ? 'f' : 'p'}`).join(',')}`;
    if (!force && sig === this.lastSig) return;
    this.lastSig = sig;
    this.V = buildView(this.S, this.Q, this.ctx());
    for (const fn of this.listeners) {
      try {
        fn(this.V);
      } catch (e) {
        console.error(e);
      }
    }
  },

  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },

  nextSeq() {
    this.seq = Math.max(this.seq + 1, Date.now() * 1000);
    return this.seq;
  },

  broadcast() {
    if (channel) channel.postMessage({ type: 'outbox', db: this.dbName });
  },

  // Chaque action est une entrée séparée : deux onglets ne peuvent pas s'écraser la file.
  // Renvoie false si l'appareil n'a pas pu la garder.
  async putOp(op) {
    const keep = () => {
      const i = this.Q.findIndex((o) => o.id === op.id);
      if (i >= 0) this.Q[i] = op;
      else this.Q.push(op);
    };
    if (!this.db) {
      if (this.volatile) keep();
      return this.volatile;
    }
    try {
      // écrite sur l'appareil AVANT d'apparaître dans la file : un envoi en cours ne peut pas prendre
      // une action que l'appareil n'a pas réussi à garder (l'utilisateur la croirait perdue et la ressaisirait)
      await IDB.setMany(this.db, [[`op:${op.id}`, op]]);
      keep();
      this.broadcast();
      return true;
    } catch (e) {
      console.error('[paulo3d] action non enregistrée sur l’appareil', e);
      return false;
    }
  },

  async removeOp(id) {
    this.Q = this.Q.filter((o) => o.id !== id);
    if (!this.db) return true;
    try {
      await IDB.delMany(this.db, [`op:${id}`]);
      this.broadcast();
      return true;
    } catch (e) {
      console.error('[paulo3d] action confirmée mais non retirée de l’appareil', e);
      return false;
    }
  },

  async reloadQueue() {
    if (!this.db) return;
    const ops = await IDB.getPrefix(this.db, 'op:');
    ops.sort((a, b) => (toNum(a.seq) - toNum(b.seq)) || String(a.created_at).localeCompare(String(b.created_at)) || (a.id < b.id ? -1 : 1));
    this.Q = ops;
    for (const op of ops) this.seq = Math.max(this.seq, toNum(op.seq));
  },

  markMeta() {
    this.metaDirty = true;
  },

  // Chaque table est écrite AVEC son repère de relecture, dans la même transaction : deux onglets
  // ne peuvent pas associer les lignes anciennes de l'un au repère récent de l'autre
  async persistSnapshotNow() {
    if (!this.db || (!this.dirty.size && !this.metaDirty)) return;
    const tables = [...this.dirty];
    this.dirty.clear();
    this.metaDirty = false;
    const entries = [];
    for (const t of tables) {
      entries.push([`snap:${t}`, valuesOf(this.S[t])]);
      entries.push([`pull:${t}`, (this.meta.lastPull || {})[t] || null]);
    }
    const rest = { ...this.meta };
    delete rest.lastPull;
    entries.push(['meta', rest]);
    try {
      await IDB.setMany(this.db, entries);
      if (this.persistError) {
        this.persistError = null;
        App.updateChrome();
      }
    } catch (e) {
      for (const t of tables) this.dirty.add(t);
      this.metaDirty = true;
      this.persistError = (e && e.message) || String(e);
      console.warn('[paulo3d] copie locale non enregistrée', e);
      App.updateChrome();
    }
  },

  persistSnapshot: null,

  upsertRows(table, rows, { source = 'server' } = {}) {
    if (!rows || !rows.length || !this.S[table]) return 0;
    const map = this.S[table];
    const pk = PK(table);
    const now = Date.now();
    let changed = 0;
    for (const raw of rows) {
      if (!raw || raw[pk] === undefined || raw[pk] === null) continue;
      const id = raw[pk];
      const key = `${table}:${id}`;
      const cur = map.get(id);
      // le temps réel peut omettre des colonnes (calculées, grandes valeurs inchangées) : on garde celles connues
      const r = normalizeRow(table, cur && source === 'realtime' ? { ...cur, ...raw } : raw);
      const incoming = tsMicros(r.updated_at);
      if (cur) {
        const known = tsMicros(cur.updated_at);
        if (incoming && known && incoming < known) continue;
        if (incoming === known && sameRow(cur, r)) continue;
      }
      // Ligne supprimée récemment : aucune version ne la fait revenir (la base ne réutilise jamais un
      // identifiant supprimé), même une version plus récente lue par une relecture partie avant la suppression
      const dead = this.tombstones.get(key);
      if (dead && now - dead.at < TOMBSTONE_MS) continue;
      map.set(id, r);
      this.receivedAt.set(key, now);
      changed++;
    }
    if (changed) {
      this.dirty.add(table);
      this.rev++;
    }
    return changed;
  },

  deleteIds(table, ids) {
    if (!ids || !ids.length || !this.S[table]) return 0;
    const now = Date.now();
    let removed = 0;
    for (const id of ids) {
      const key = `${table}:${id}`;
      this.tombstones.set(key, { at: now });
      if (this.S[table].delete(id)) removed++;
      this.receivedAt.delete(key);
    }
    if (removed) {
      this.dirty.add(table);
      this.rev++;
    }
    if (this.tombstones.size > 5000) {
      for (const [k, t] of this.tombstones) if (now - t.at > TOMBSTONE_MS) this.tombstones.delete(k);
    }
    return removed;
  },

  // Supprime localement les lignes que la base n'a plus, sauf celles reçues pendant la relecture
  // (les deux heures comparées sont celles de l'appareil)
  reconcile(table, serverIds, startedAt) {
    const removed = [];
    for (const id of this.S[table].keys()) {
      if (serverIds.has(id)) continue;
      const got = this.receivedAt.get(`${table}:${id}`);
      if (got && got > startedAt - 120000) continue;
      removed.push(id);
    }
    if (removed.length) this.deleteIds(table, removed);
    return removed.length;
  },

  // La base dit que la ligne n'existe plus (P3D10) : elle disparaît de l'écran tout de suite
  // (sinon elle resterait affichée jusqu'au prochain rapprochement complet)
  forgetMissing(op) {
    if (!/\.(save|patch)$/.test(String(op.type))) return;
    const table = { spool: 'spools', template: 'templates', machine: 'machines' }[String(op.type).split('.')[0]];
    if (table && op.payload && op.payload.id) this.deleteIds(table, [op.payload.id]);
  },

  mergeBundle(bundle) {
    if (!bundle) return;
    for (const t of TABLES) if (Array.isArray(bundle[t])) this.upsertRows(t, bundle[t]);
    if (bundle.deleted) for (const [t, ids] of Object.entries(bundle.deleted)) if (TABLES.includes(t)) this.deleteIds(t, ids || []);
  },

  // Une suppression confirmée s'applique tout de suite, même si la base ne renvoie rien (renvoi d'une
  // suppression déjà faite) : sinon la ligne réapparaîtrait jusqu'au prochain rapprochement
  applyConfirmedDelete(op) {
    const def = OPS[op.type];
    if (!def || !def.isDelete) return;
    const V = cloneState(this.S);
    try {
      def.apply(V, op.payload, this.ctx());
    } catch (e) {
      console.warn('[paulo3d] suppression locale impossible', e);
      return;
    }
    for (const t of TABLES) {
      const removed = [...this.S[t].keys()].filter((id) => !V[t].has(id));
      if (removed.length) this.deleteIds(t, removed);
      let changed = 0;
      for (const [id, row] of V[t]) {
        if (this.S[t].has(id) && this.S[t].get(id) !== row) {
          this.S[t].set(id, row);
          changed++;
        }
      }
      if (changed) {
        this.dirty.add(t);
        this.rev++;
      }
    }
  },
};

Store.persistSnapshot = debounce(() => Store.persistSnapshotNow(), 400);

// Appli mise en arrière-plan ou fermée : la copie locale est écrite tout de suite, sans attendre
// le délai ci-dessus (une action confirmée juste avant reste visible hors-ligne à la réouverture)
if (typeof document !== 'undefined' && typeof addEventListener === 'function') {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') Store.persistSnapshotNow();
  });
  addEventListener('pagehide', () => Store.persistSnapshotNow());
}

/* ==== 30-backend.js ==== */
/* =============================================================================
   Liaison avec la base
   - SupabaseBackend : la vraie base (PostgREST + Auth + Realtime)
   - DemoBackend     : mode démo, tout reste sur cet appareil (rien n'est envoyé)
   ============================================================================= */

const PAGE = 1000;
const REQUEST_TIMEOUT_MS = 30000;

// Requête bloquée (réseau d'atelier instable, 4G faible) : abandon après 30 s SANS RIEN RECEVOIR.
// Elle est alors traitée comme une coupure (l'action reste en attente et repart plus tard) au lieu
// de bloquer l'envoi de toutes les actions pendant plusieurs minutes.
// ⚠️ Délai d'INACTIVITÉ, pas délai total : le compteur repart à chaque morceau reçu. Un délai total
// coupait à 30 s un téléchargement qui AVANÇAIT (première synchro d'un appareil : des Mo de
// modèles avec photos sur une 4G faible) — « Hors-ligne », et le même téléchargement recommencé
// sans fin. Un téléchargement BLOQUÉ à mi-chemin est toujours abandonné.
async function fetchWithTimeout(input, init = {}) {
  if (init.signal || typeof AbortController === 'undefined') return fetch(input, init);
  const ctrl = new AbortController();
  let timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  const relancer = () => { clearTimeout(timer); timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS); };
  try {
    const res = await fetch(input, { ...init, signal: ctrl.signal });
    let body = null;
    if (![101, 204, 205, 304].includes(res.status)) {
      if (res.body && typeof res.body.getReader === 'function') {
        const lecteur = res.body.getReader();
        const morceaux = [];
        let total = 0;
        for (;;) {
          const { done, value } = await lecteur.read();
          if (done) break;
          morceaux.push(value);
          total += value.byteLength;
          relancer();
        }
        body = new Uint8Array(total);
        let pos = 0;
        for (const m of morceaux) { body.set(m, pos); pos += m.byteLength; }
      } else {
        body = await res.arrayBuffer();
      }
    }
    return new Response(body, { status: res.status, statusText: res.statusText, headers: res.headers });
  } finally {
    clearTimeout(timer);
  }
}

function wrapError(error, status) {
  const e = new Error(error && error.message ? error.message : 'Erreur inconnue');
  e.code = error && error.code ? error.code : '';
  e.status = status === undefined ? (error && error.status) || 0 : status;
  e.details = error && error.details;
  e.hint = error && error.hint;
  return e;
}

const AUTH_CODES = ['42501', 'PGRST301', 'PGRST302', 'PGRST303'];

// Classe une erreur. Le texte du message n'est JAMAIS utilisé quand la base a répondu :
// un refus « Stock insuffisant pour « Boîtier de connexion » » reste un refus, pas une coupure.
function classifyError(e) {
  if (e instanceof OpError) return 'business';
  const status = toNum(e && e.status, 0);
  const code = String((e && e.code) || '');
  if (e && e.name === 'AbortError') return 'network';
  if (!status) return 'network';
  if (status === 401 || AUTH_CODES.includes(code)) return 'auth';
  if (code === 'PGRST202' || code === 'PGRST205' || code === '42P01' || code === '42883' || code === 'PGRST204') return 'schema';
  if (status >= 500 || status === 408 || status === 429 || code === '57014') return 'network';
  return 'business';
}

function friendlyError(e, op) {
  const code = String((e && e.code) || '');
  if (/^P3D/.test(code)) return e.message;
  if (code === '23503') {
    return op && /\.delete$/.test(op.type)
      ? "Impossible de supprimer : cet élément est utilisé dans l'historique. Archive-le plutôt."
      : 'Un élément lié a été supprimé entre-temps (bobine, template…).';
  }
  if (code === '23514') return 'La base a refusé une valeur (nombre négatif, stock insuffisant ou texte trop long).';
  if (code === '23505') return 'Cet élément existe déjà.';
  if (code === '22P02' || code === '22003') return 'Une valeur a un format invalide.';
  if (code === '42501') return 'Accès refusé : reconnecte-toi.';
  if (classifyError(e) === 'schema') return "La base n'est pas à jour : relance le script SQL dans Supabase.";
  return (e && e.message) || 'Erreur inconnue.';
}

function projectRefFromUrl(url) {
  try {
    const u = new URL(url);
    const m = u.hostname.match(/^([a-z0-9]{10,40})\.supabase\.(co|in|net)$/i);
    if (m) return m[1].toLowerCase();
    let h = 0;
    for (const c of `${u.origin}${u.pathname}`) h = (h * 31 + c.charCodeAt(0)) | 0;
    return `h${(h >>> 0).toString(36)}`;
  } catch {
    return 'invalide';
  }
}

function normalizeSupaUrl(input) {
  let s = String(input || '').trim();
  if (!s) return '';
  if (/^[a-z0-9]{20}$/i.test(s)) s = `https://${s}.supabase.co`;
  if (!/^https?:\/\//i.test(s)) s = `https://${s}`;
  try {
    const u = new URL(s);
    const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(u.hostname);
    if (u.protocol !== 'https:' && !local) return '';
    return `${u.origin}${u.pathname.replace(/\/(rest|auth)\/v1.*$/, '').replace(/\/+$/, '')}`;
  } catch {
    return '';
  }
}

// La base n'a modifié AUCUNE ligne : la ligne n'existe plus (supprimée sur un autre appareil, ou jamais
// créée parce que sa création a été refusée). Ce n'est pas un succès : l'action est refusée, avec la raison.
function nothingSaved(rows, what, deleted) {
  if (Array.isArray(rows) && rows.length) return rows;
  throw new OpError('P3D10', `${what} n'existe plus (${deleted} sur un autre appareil ?) : modification non enregistrée.`);
}

const REMOTE = {
  async 'settings.init'(b, p) {
    const row = { owner_id: b.userId, ...pick(p, SETTINGS_FIELDS) };
    await b.exec(b.sb.from('settings').upsert(row, { onConflict: 'owner_id', ignoreDuplicates: true }));
    return { settings: await b.exec(b.sb.from('settings').select('*')) };
  },
  async 'settings.save'(b, p) {
    const row = { owner_id: b.userId, ...pick(p, SETTINGS_FIELDS) };
    return { settings: await b.exec(b.sb.from('settings').upsert(row, { onConflict: 'owner_id' }).select()) };
  },
  async 'spool.patch'(b, p) {
    const fields = pick(p.fields || {}, SPOOL_FIELDS.filter((f) => f !== 'id'));
    return { spools: nothingSaved(await b.exec(b.sb.from('spools').update(fields).eq('id', p.id).select()), 'Cette bobine', 'supprimée') };
  },
  async 'template.patch'(b, p) {
    const fields = pick(p.fields || {}, TEMPLATE_FIELDS.filter((f) => f !== 'id'));
    return { templates: nothingSaved(await b.exec(b.sb.from('templates').update(fields).eq('id', p.id).select()), 'Ce template', 'supprimé') };
  },
  async 'machine.save'(b, p) {
    const rows = nothingSaved(await b.exec(b.sb.from('machines').upsert(pick(p, MACHINE_FIELDS), { onConflict: 'id' }).select()), 'Cette machine', 'supprimée');
    const out = { machines: rows };
    if (p.is_default) out.machines = await b.pullTable('machines');
    return out;
  },
  async 'machine.delete'(b, p) {
    const rows = await b.exec(b.sb.from('machines').delete().eq('id', p.id).select('id'));
    return { deleted: { machines: rows.map((r) => r.id) }, pullAfter: true };
  },
  async 'spool.save'(b, p) {
    return { spools: nothingSaved(await b.exec(b.sb.from('spools').upsert(pick(p, SPOOL_FIELDS), { onConflict: 'id' }).select()), 'Cette bobine', 'supprimée') };
  },
  async 'spool.delete'(b, p) {
    const rows = await b.exec(b.sb.from('spools').delete().eq('id', p.id).select('id'));
    return { deleted: { spools: rows.map((r) => r.id) } };
  },
  async 'spool.weigh'(b, p) {
    return b.exec(b.sb.rpc('p3d_weigh_spool', { p }));
  },
  async 'template.save'(b, p) {
    return { templates: nothingSaved(await b.exec(b.sb.from('templates').upsert(pick(p, TEMPLATE_FIELDS), { onConflict: 'id' }).select()), 'Ce template', 'supprimé') };
  },
  async 'template.delete'(b, p) {
    const rows = await b.exec(b.sb.from('templates').delete().eq('id', p.id).select('id'));
    return { deleted: { templates: rows.map((r) => r.id) }, pullAfter: true };
  },
  async 'production.launch'(b, p) {
    return b.exec(b.sb.rpc('p3d_launch_production', { p }));
  },
  async 'production.delete'(b, p) {
    return b.exec(b.sb.rpc('p3d_delete_production', { p_id: p.id }));
  },
  async 'stock.add'(b, p) {
    return b.exec(b.sb.rpc('p3d_add_stock', { p }));
  },
  async 'stock.adjust'(b, p) {
    return b.exec(b.sb.rpc('p3d_adjust_stock', { p }));
  },
  async 'sale.record'(b, p) {
    return b.exec(b.sb.rpc('p3d_record_sale', { p }));
  },
  async 'sale.delete'(b, p) {
    return b.exec(b.sb.rpc('p3d_delete_sale', { p_id: p.id }));
  },
};

class SupabaseBackend {
  constructor(url, key) {
    this.kind = 'supabase';
    this.url = url;
    this.key = key;
    this.ref = projectRefFromUrl(url);
    this.userId = null;
    this.channel = null;
    this.sb = supabase.createClient(url, key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: `p3d-auth-${this.ref}` },
      realtime: { params: { eventsPerSecond: 20 } },
      global: { headers: { 'x-client-info': `paulo3d/${APP_VERSION}` }, fetch: fetchWithTimeout },
    });
  }

  ready() {
    return !!this.userId;
  }

  async exec(query) {
    let res;
    try {
      res = await query;
    } catch (e) {
      throw wrapError({ message: e && e.message ? e.message : String(e) }, 0);
    }
    if (res.error) throw wrapError(res.error, res.status);
    return res.data;
  }

  async send(op) {
    const fn = REMOTE[op.type];
    if (!fn) throw new OpError('LOCAL', `Action inconnue : ${op.type}`);
    return fn(this, op.payload);
  }

  // Lecture des changements depuis la dernière fois. S'il y en a trop pour une page,
  // relecture complète par identifiant (une page ne peut alors ni sauter ni doubler une ligne).
  async pullTable(table, since) {
    if (since) {
      let res;
      try {
        res = await this.sb.from(table).select('*', { count: 'exact' })
          .gt('updated_at', new Date(time(since) - 300000).toISOString())
          .order('updated_at', { ascending: true }).limit(PAGE);
      } catch (e) {
        throw wrapError({ message: e && e.message ? e.message : String(e) }, 0);
      }
      if (res.error) throw wrapError(res.error, res.status);
      const rows = res.data || [];
      if (res.count === null || res.count === undefined || res.count <= rows.length) return rows;
    }
    return this.pullAllById(table, '*');
  }

  // Pagination par identifiant croissant : stable même si des lignes changent pendant la lecture,
  // et correcte même si le projet limite les réponses à moins de 1000 lignes (on lit jusqu'à une page vide)
  async pullAllById(table, columns) {
    const pk = PK(table);
    const out = [];
    let last = null;
    for (;;) {
      let q = this.sb.from(table).select(columns).order(pk, { ascending: true }).limit(PAGE);
      if (last !== null) q = q.gt(pk, last);
      const rows = await this.exec(q);
      if (!rows.length) break;
      out.push(...rows);
      last = rows[rows.length - 1][pk];
    }
    return out;
  }

  async pullIds(table) {
    const pk = PK(table);
    return new Set((await this.pullAllById(table, pk)).map((r) => r[pk]));
  }

  async checkSchema() {
    const v = await this.exec(this.sb.rpc('p3d_version'));
    return toNum(v, 0);
  }

  async refreshAuth() {
    try {
      const { data, error } = await this.sb.auth.refreshSession();
      if (error) return classifyError(wrapError(error, error.status)) === 'network' ? 'network' : 'invalid';
      return data && data.session ? 'ok' : 'invalid';
    } catch {
      return 'network';
    }
  }

  subscribe(onChange, onStatus) {
    this.unsubscribe();
    if (!this.userId) return;
    this.channel = this.sb
      .channel(`p3d-${this.userId}`)
      .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => onChange(payload))
      .subscribe((status) => onStatus(status));
  }

  unsubscribe() {
    if (this.channel) {
      try {
        this.sb.removeChannel(this.channel);
      } catch { /* déjà fermé */ }
      this.channel = null;
    }
  }
}

/* ---------- mode démo : une « base » locale qui rejoue les mêmes règles ---------- */
class DemoBackend {
  constructor() {
    this.kind = 'demo';
    this.userId = '00000000-0000-4000-8000-00000000d3e0';
    this.ref = 'demo';
    this.S = emptyState();
    this.db = null;
  }

  ready() {
    return true;
  }

  async load() {
    try {
      this.db = await IDB.open('paulo3d:demo-server');
      for (const t of TABLES) {
        const rows = await IDB.get(this.db, `snap:${t}`);
        if (Array.isArray(rows)) for (const r of rows) this.S[t].set(r[PK(t)], r);
      }
    } catch {
      this.db = null;
    }
  }

  async save() {
    if (!this.db) return;
    await IDB.setMany(this.db, TABLES.map((t) => [`snap:${t}`, valuesOf(this.S[t])]));
  }

  offline() {
    return lsGet(LS.demoOffline, false) === true;
  }

  async send(op) {
    if (!this.fast) await sleep(120);
    if (this.offline()) throw wrapError({ message: 'Failed to fetch (démo hors-ligne)' }, 0);
    const def = OPS[op.type];
    if (!def) throw new OpError('LOCAL', `Action inconnue : ${op.type}`);
    if (def.done && def.done(this.S, op.payload)) return {};
    const V = cloneState(this.S);
    const err = def.validate ? def.validate(V, op.payload) : null;
    if (err) throw err;
    def.apply(V, op.payload, { userId: this.userId, now: new Date().toISOString() });
    const bundle = { deleted: {} };
    for (const t of TABLES) {
      const changed = [];
      for (const [id, row] of V[t]) if (this.S[t].get(id) !== row) changed.push(row);
      const removed = [...this.S[t].keys()].filter((id) => !V[t].has(id));
      if (changed.length) bundle[t] = changed;
      if (removed.length) bundle.deleted[t] = removed;
      this.S[t] = V[t];
    }
    await this.save();
    return bundle;
  }

  async pullTable(table, since) {
    await sleep(60);
    if (this.offline()) throw wrapError({ message: 'Failed to fetch (démo hors-ligne)' }, 0);
    return valuesOf(this.S[table]).filter((r) => !since || !r.updated_at || time(r.updated_at) > time(since) - 300000);
  }

  async pullIds(table) {
    if (this.offline()) throw wrapError({ message: 'Failed to fetch (démo hors-ligne)' }, 0);
    return new Set(this.S[table].keys());
  }

  async checkSchema() {
    return SCHEMA_VERSION;
  }

  async refreshAuth() {
    return 'ok';
  }

  subscribe() {}

  unsubscribe() {}

  async reset() {
    this.S = emptyState();
    await this.save();
  }
}

/* ==== 35-sync.js ==== */
/* =============================================================================
   Synchronisation
   - Toute action passe par la file d'envoi, gardée sur l'appareil AVANT d'être
     annoncée. L'écran ne dit « enregistré » qu'après la réponse de la base.
   - Sans réseau : l'action attend et repart toute seule au retour du réseau.
   - Session expirée : rien n'est envoyé ni refusé tant qu'on ne s'est pas reconnecté.
   - Refusée par la base : l'action est mise de côté et affichée, jamais oubliée.
   ============================================================================= */

async function withLock(name, fn) {
  if (globalThis.navigator && navigator.locks && typeof navigator.locks.request === 'function') {
    return navigator.locks.request(name, fn);
  }
  return fn();
}

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) {
      const k = i++;
      out[k] = await fn(items[k], k);
    }
  });
  await Promise.all(workers);
  return out;
}

const Sync = {
  backend: null,
  state: {
    online: globalThis.navigator ? navigator.onLine !== false : true,
    flushing: false,
    pulling: false,
    realtime: 'off',
    lastPullAt: null,
    lastConfirmAt: null,
    lastError: null,
    needsLogin: false,
    schemaVersion: null,
    firstPullDone: false,
  },
  waiters: new Map(),
  listeners: new Set(),
  retryTimer: null,
  retryDelay: 0,
  flushAgain: false,
  timers: [],
  confirmedWhileAway: 0,
  failedWhileAway: 0,
  skippedWhileAway: 0,

  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },
  emit() {
    for (const fn of this.listeners) {
      try {
        fn(this.state);
      } catch (e) {
        console.error(e);
      }
    }
  },

  start(backend) {
    this.stop();
    this.backend = backend;
    this.state.needsLogin = false;
    this.state.firstPullDone = false;
    this.state.schemaVersion = null;
    const onOnline = () => {
      this.state.online = true;
      this.emit();
      this.kick();
    };
    const onOffline = () => {
      this.state.online = false;
      this.emit();
    };
    const onVisible = () => {
      if (document.visibilityState === 'visible') {
        const stale = !this.state.lastPullAt || Date.now() - time(this.state.lastPullAt) > 30000;
        // des actions attendent : on retente tout de suite (sans attendre la fin du délai d'attente)
        const waiting = Store.Q.some((o) => o.status === 'pending');
        if (stale || waiting) this.kick();
      }
    };
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    document.addEventListener('visibilitychange', onVisible);
    const every = setInterval(() => {
      if (document.visibilityState === 'visible') this.kick();
    }, 5 * 60000);
    this.timers.push(() => {
      window.removeEventListener('online', onOnline);
      window.removeEventListener('offline', onOffline);
      document.removeEventListener('visibilitychange', onVisible);
      clearInterval(every);
    });
    if (channel) {
      const onMsg = async (ev) => {
        if (ev.data && ev.data.type === 'outbox' && ev.data.db === Store.dbName) {
          // sous le verrou d'envoi : jamais une copie périmée de la file pendant qu'un envoi la modifie
          await withLock(`p3d-flush:${Store.dbName}`, () => Store.reloadQueue());
          Store.rebuild();
          this.emit();
        }
      };
      channel.addEventListener('message', onMsg);
      this.timers.push(() => channel.removeEventListener('message', onMsg));
    }
    backend.subscribe(
      (payload) => this.onRealtime(payload),
      (status) => this.onRealtimeStatus(status),
    );
    // Nouvelle session : seules les actions refusées À CAUSE de la session repartent
    // (une action refusée par la base pour une autre raison reste refusée : sinon doublon)
    withLock(`p3d-flush:${Store.dbName}`, async () => {
      await Store.reloadQueue();
      const reset = Store.Q.filter((o) => (o.status === 'failed' ? !!(o.error && AUTH_CODES.includes(o.error.code)) : !!o.authRetried));
      for (const o of reset) {
        await Store.putOp({ ...o, authRetried: false, status: o.status === 'failed' ? 'pending' : o.status, error: o.status === 'failed' ? null : o.error });
      }
      return reset.length;
    })
      .then((n) => {
        if (n) Store.rebuild();
      })
      .catch((e) => console.error('[paulo3d] reprise des actions impossible', e))
      .finally(() => this.kick(true));
  },

  stop() {
    for (const off of this.timers) off();
    this.timers = [];
    clearTimeout(this.retryTimer);
    if (this.backend) this.backend.unsubscribe();
    this.backend = null;
    this.state.realtime = 'off';
  },

  async kick(reconcile = false) {
    await this.flush();
    await this.pull({ reconcile });
    if (Store.Q.some((o) => o.status === 'pending')) await this.flush();
  },

  // Bouton « Synchroniser maintenant » : attend la fin d'un envoi ou d'une lecture DÉJÀ en cours,
  // puis annonce ce qui est VRAI. (18/09 : « Synchronisation terminée » s'affichait pendant qu'une
  // vente lente partait encore, ou alors que rien n'était parti — session expirée.)
  async syncNow({ maxWait = 30000 } = {}) {
    await this.kick(true);
    const until = Date.now() + maxWait;
    while ((this.state.flushing || this.state.pulling) && Date.now() < until) await sleep(200);
    return this.syncVerdict();
  },

  syncVerdict() {
    const { pending, failed } = this.summary();
    const s = this.state;
    const actions = (n) => `${n} action${n > 1 ? 's' : ''}`;
    if (s.needsLogin) return { tone: 'bad', message: pending ? `Reconnecte-toi : ${actions(pending)} en attente, rien n'est parti` : 'Reconnecte-toi pour synchroniser' };
    if (!s.online) return { tone: 'warn', message: pending ? `Toujours pas de connexion · ${actions(pending)} en attente` : 'Toujours pas de connexion' };
    if (s.flushing || s.pulling) return { tone: 'warn', message: 'Toujours en cours : la base répond lentement' };
    if (s.lastError) return { tone: 'bad', message: s.lastError };
    if (pending) return { tone: 'warn', message: `${actions(pending)} pas encore envoyée${pending > 1 ? 's' : ''}` };
    if (failed) return { tone: 'bad', message: `${actions(failed)} refusée${failed > 1 ? 's' : ''} : voir ci-dessous` };
    return { tone: 'ok', message: 'Synchronisation terminée' };
  },

  // Enregistre une action. Résultat : confirmed | queued | failed | rejected
  // silent : action technique (pas d'annonce « envoyée » plus tard)
  async enqueue(type, payload, { wait = 7000, silent = false } = {}) {
    const def = OPS[type];
    if (!def) return { state: 'rejected', error: new OpError('LOCAL', `Action inconnue : ${type}`) };
    const err = def.validate ? def.validate(Store.V, payload) : null;
    if (err) return { state: 'rejected', error: err };
    const op = { id: uuid(), type, payload, created_at: new Date().toISOString(), seq: Store.nextSeq(), status: 'pending', attempts: 0, error: null, silent };
    const kept = await Store.putOp(op);
    if (!kept) {
      Store.Q = Store.Q.filter((o) => o.id !== op.id);
      return { state: 'rejected', error: new OpError('LOCAL', "L'appareil n'a pas pu garder cette action (mémoire pleine ?). Rien n'a été enregistré.") };
    }
    Store.rebuild();
    this.emit();
    const done = new Promise((resolve) => this.waiters.set(op.id, resolve));
    this.flush();
    const timeout = sleep(wait).then(() => ({ state: 'queued', slow: true, timedOut: true }));
    const res = await Promise.race([done, timeout]);
    // délai écoulé : la réponse arrivera plus tard et sera annoncée comme telle
    if (res.timedOut) this.waiters.delete(op.id);
    return { state: res.state, error: res.error, slow: res.slow, tombstoned: !!res.tombstoned, opId: op.id };
  },

  resolveWaiter(op, result) {
    const w = this.waiters.get(op.id);
    if (w) {
      this.waiters.delete(op.id);
      w(result);
      return;
    }
    if (op.silent && result.state !== 'failed') return;
    // « supprimé entre-temps sur un autre appareil » : l'action n'a rien enregistré, on ne l'annonce pas comme faite
    if (result.state === 'confirmed' && result.tombstoned) this.skippedWhileAway++;
    else if (result.state === 'confirmed') this.confirmedWhileAway++;
    else if (result.state === 'failed') this.failedWhileAway++;
  },

  resolvePendingAsQueued() {
    for (const op of Store.Q) if (op.status === 'pending' || op.status === 'sending') this.resolveWaiter(op, { state: 'queued' });
  },

  scheduleRetry() {
    clearTimeout(this.retryTimer);
    this.retryDelay = Math.min(60000, this.retryDelay ? this.retryDelay * 2 : 3000);
    this.retryTimer = setTimeout(() => this.kick(), this.retryDelay);
  },

  async flush() {
    if (!this.backend || !this.backend.ready() || this.state.needsLogin) {
      this.resolvePendingAsQueued();
      return;
    }
    if (this.state.flushing) {
      this.flushAgain = true;
      return;
    }
    this.state.flushing = true;
    this.emit();
    try {
      await withLock(`p3d-flush:${Store.dbName}`, async () => {
        await Store.reloadQueue();
        for (;;) {
          if (this.state.needsLogin) {
            this.resolvePendingAsQueued();
            return;
          }
          // sous le verrou, une action « en cours d'envoi » est forcément un envoi interrompu
          const found = Store.Q.find((o) => o.status === 'pending' || o.status === 'sending');
          if (!found) break;
          const op = { ...found, status: 'sending', attempts: (found.attempts || 0) + 1 };
          await Store.putOp(op);
          let bundle;
          try {
            bundle = await this.backend.send(op);
          } catch (e) {
            const kind = classifyError(e);
            if (kind === 'network') {
              // authRetried remis à zéro : une prochaine expiration de session aura droit à son rafraîchissement
              await Store.putOp({ ...op, status: 'pending', authRetried: false });
              this.state.online = false;
              this.scheduleRetry();
              this.resolvePendingAsQueued();
              return;
            }
            if (kind === 'auth') {
              // premier refus : on rafraîchit la session et on réessaie une fois
              const r = op.authRetried ? 'retried' : await this.backend.refreshAuth();
              if (r === 'ok') {
                await Store.putOp({ ...op, status: 'pending', authRetried: true });
                continue;
              }
              if (r === 'network') {
                await Store.putOp({ ...op, status: 'pending' });
                this.scheduleRetry();
                this.resolvePendingAsQueued();
                return;
              }
              if (r === 'invalid') {
                await Store.putOp({ ...op, status: 'pending', authRetried: false });
                this.state.needsLogin = true;
                this.resolvePendingAsQueued();
                return;
              }
              // session valide mais la base refuse encore : c'est un vrai refus
            }
            if (kind === 'schema') {
              await Store.putOp({ ...op, status: 'pending', authRetried: false });
              this.state.lastError = friendlyError(e, op);
              this.resolvePendingAsQueued();
              return;
            }
            const failed = { ...op, status: 'failed', authRetried: false, error: { code: e.code || '', message: friendlyError(e, op), at: new Date().toISOString() } };
            if (e.code === 'P3D10') Store.forgetMissing(op);
            await Store.putOp(failed);
            Store.rebuild();
            this.resolveWaiter(failed, { state: 'failed', error: failed.error });
            continue;
          }
          Store.applyConfirmedDelete(op);
          Store.mergeBundle(bundle);
          await Store.removeOp(op.id);
          Store.persistSnapshot();
          Store.rebuild();
          this.state.online = true;
          this.state.lastConfirmAt = new Date().toISOString();
          this.retryDelay = 0;
          this.resolveWaiter(op, { state: 'confirmed', tombstoned: !!(bundle && bundle.tombstoned) });
          if (bundle && bundle.pullAfter) setTimeout(() => this.pull(), 50);
        }
      });
    } catch (e) {
      console.error('[paulo3d] envoi interrompu', e);
    } finally {
      this.state.flushing = false;
      this.emit();
      if (this.flushAgain) {
        this.flushAgain = false;
        this.flush();
      }
    }
  },

  async pull({ reconcile = false } = {}) {
    if (!this.backend || !this.backend.ready() || this.state.pulling || this.state.needsLogin) return;
    this.state.pulling = true;
    this.emit();
    const startedAt = Date.now();
    try {
      if (this.state.schemaVersion === null) {
        this.state.schemaVersion = await this.backend.checkSchema();
      }
      const since = Store.meta.lastPull || {};
      const results = await mapLimit(TABLES, 4, async (t) => [t, await this.backend.pullTable(t, since[t])]);
      for (const [t, rows] of results) {
        Store.upsertRows(t, rows);
        let max = since[t] || null;
        for (const r of rows) if (r.updated_at && (!max || tsMicros(r.updated_at) > tsMicros(max))) max = r.updated_at;
        if (max && max !== since[t]) {
          Store.meta.lastPull = { ...Store.meta.lastPull, [t]: max };
          Store.dirty.add(t);
        }
      }
      const needReconcile = reconcile || !Store.meta.lastReconcile || Date.now() - Store.meta.lastReconcile > 10 * 60000;
      if (needReconcile) {
        const idLists = await mapLimit(TABLES, 4, async (t) => [t, await this.backend.pullIds(t)]);
        for (const [t, ids] of idLists) Store.reconcile(t, ids, startedAt);
        Store.meta.lastReconcile = Date.now();
        Store.markMeta();
      }
      // Compte neuf : réglages par défaut seulement si la base n'en a vraiment aucun
      if (!firstRow(Store.S.settings) && !Store.Q.some((o) => o.type === 'settings.init' || o.type === 'settings.save')) {
        const rows = await this.backend.pullTable('settings');
        if (rows.length) Store.upsertRows('settings', rows);
        else this.enqueue('settings.init', { ...DEFAULT_SETTINGS }, { wait: 0, silent: true });
      }
      await Store.persistSnapshotNow();
      Store.rebuild();
      this.state.online = true;
      this.state.lastPullAt = new Date().toISOString();
      this.state.lastError = null;
      this.state.firstPullDone = true;
    } catch (e) {
      const kind = classifyError(e);
      if (kind === 'network') {
        this.state.online = false;
        this.scheduleRetry();
      } else if (kind === 'auth') {
        const r = await this.backend.refreshAuth();
        if (r === 'invalid') this.state.needsLogin = true;
        else this.scheduleRetry();
      } else {
        this.state.lastError = friendlyError(e);
        console.error('[paulo3d] lecture de la base impossible', e);
      }
    } finally {
      this.state.pulling = false;
      this.emit();
    }
  },

  // Le temps réel met à jour l'écran mais n'avance jamais les repères de relecture :
  // un évènement manqué sera rattrapé par la relecture suivante
  onRealtime(payload) {
    const t = payload.table;
    if (!TABLES.includes(t)) return;
    if (payload.eventType === 'DELETE') {
      const id = payload.old && payload.old[PK(t)];
      if (id) Store.deleteIds(t, [id]);
    } else if (payload.new) {
      Store.upsertRows(t, [payload.new], { source: 'realtime' });
    }
    this.realtimeRebuild();
  },

  realtimeRebuild: debounce(() => {
    Store.rebuild();
    Store.persistSnapshot();
  }, 120),

  onRealtimeStatus(status) {
    const prev = this.state.realtime;
    this.state.realtime = status === 'SUBSCRIBED' ? 'on' : status === 'CLOSED' ? 'off' : 'error';
    this.emit();
    if (status === 'SUBSCRIBED' && prev !== 'on' && this.state.firstPullDone) this.pull();
  },

  async retryOp(opId) {
    const op = Store.Q.find((o) => o.id === opId);
    if (!op) return;
    await Store.putOp({ ...op, status: 'pending', error: null, authRetried: false });
    Store.rebuild();
    this.emit();
    this.flush();
  },

  async discardOp(opId) {
    await Store.removeOp(opId);
    Store.rebuild();
    this.emit();
  },

  summary() {
    const failed = Store.Q.filter((o) => o.status === 'failed').length;
    const pending = Store.Q.length - failed;
    const s = this.state;
    if (this.backend && this.backend.kind === 'demo') {
      if (this.backend.offline()) return { tone: 'off', label: pending ? `Démo hors-ligne · ${pending}` : 'Démo hors-ligne', pending, failed };
      return { tone: 'demo', label: failed ? `Démo · ${failed} refusée${failed > 1 ? 's' : ''}` : 'Mode démo', pending, failed };
    }
    if (s.needsLogin) return { tone: 'bad', label: 'Reconnexion requise', pending, failed };
    if (failed) return { tone: 'bad', label: `${failed} action${failed > 1 ? 's' : ''} refusée${failed > 1 ? 's' : ''}`, pending, failed };
    if (!s.online) return { tone: 'off', label: pending ? `Hors-ligne · ${pending} en attente` : 'Hors-ligne', pending, failed };
    if (pending || s.flushing) return { tone: 'warn', label: pending ? `Envoi · ${pending} en attente` : 'Envoi…', pending, failed };
    if (s.lastError) return { tone: 'bad', label: 'Base injoignable', pending, failed };
    if (!s.firstPullDone && s.pulling) return { tone: 'warn', label: 'Chargement…', pending, failed };
    return { tone: 'ok', label: 'Synchronisé', pending, failed };
  },
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const TONES = {
  ok: { text: 'text-neon', bg: 'bg-neon/10', border: 'border-neon/30', dot: 'bg-neon' },
  warn: { text: 'text-amber-300', bg: 'bg-amber-400/10', border: 'border-amber-400/30', dot: 'bg-amber-400' },
  bad: { text: 'text-rose-300', bg: 'bg-rose-500/10', border: 'border-rose-500/30', dot: 'bg-rose-500' },
  off: { text: 'text-slate-300', bg: 'bg-slate-500/10', border: 'border-slate-500/30', dot: 'bg-slate-400' },
  info: { text: 'text-cyan-300', bg: 'bg-cyan-400/10', border: 'border-cyan-400/30', dot: 'bg-cyan-400' },
  demo: { text: 'text-violet-300', bg: 'bg-violet-500/10', border: 'border-violet-400/30', dot: 'bg-violet-400' },
};

/* ---------- composants ---------- */
// Attributs supplémentaires : TOUJOURS un objet, valeurs échappées. Ex. { 'data-id': id, autofocus: true }
function attrList(obj) {
  if (!obj) return raw('');
  if (typeof obj !== 'object') throw new Error('attrs doit être un objet { nom: valeur }');
  const out = [];
  for (const [k, v] of Object.entries(obj)) {
    if (!/^[a-z][a-z0-9-]*$/i.test(k)) throw new Error(`nom d'attribut refusé : ${k}`);
    if (v === false || v === null || v === undefined) continue;
    out.push(v === true ? k : `${k}="${esc(v)}"`);
  }
  return raw(out.join(' '));
}

function btn(label, { variant = 'secondary', icon: ic, action, size = 'md', attrs = null, type = 'button', cls = '', title } = {}) {
  const sizes = { sm: 'h-9 px-3 text-[13px] rounded-lg', md: 'h-11 px-4 text-sm rounded-xl', lg: 'h-12 px-5 text-[15px] rounded-xl', icon: 'h-10 w-10 rounded-xl', iconSm: 'h-9 w-9 rounded-xl' };
  return html`<button type="${type}" class="btn btn-${variant} ${sizes[size]} ${cls}" ${action ? raw(`data-action="${esc(action)}"`) : ''} ${title ? raw(`title="${esc(title)}" aria-label="${esc(title)}"`) : ''} ${attrList(attrs)}>${ic ? icon(ic, size === 'sm' ? 'w-4 h-4' : 'w-[18px] h-[18px]') : ''}${label ? html`<span>${label}</span>` : ''}</button>`;
}

function badge(text, tone = 'off', { dot = false, cls = '' } = {}) {
  const t = TONES[tone] || TONES.off;
  return html`<span class="inline-flex items-center gap-1.5 rounded-full border ${t.border} ${t.bg} ${t.text} px-2 py-0.5 text-[11px] font-semibold whitespace-nowrap ${cls}">${dot ? html`<span class="h-1.5 w-1.5 rounded-full ${t.dot}"></span>` : ''}${text}</span>`;
}

function pendingBadge(V, key) {
  return V.pending.has(key) ? badge('En attente d’envoi', 'warn', { dot: true }) : '';
}

function field(label, control, { hint, cls = '', id } = {}) {
  return html`<label class="block ${cls}" ${id ? raw(`for="${esc(id)}"`) : ''}>
    <span class="label">${label}</span>
    ${control}
    ${hint ? html`<span class="mt-1 block text-[12px] text-slate-500">${hint}</span>` : ''}
  </label>`;
}

function inputNum(name, value, { suffix, placeholder = '0', step = 'any', min, cls = '', attrs = null, inputmode = 'decimal' } = {}) {
  let v = value === null || value === undefined || value === '' || (typeof value === 'number' && !Number.isFinite(value)) ? '' : String(value).replace('.', ',');
  // Montants en euros : « 22,50 » et non « 22,5 », sans jamais arrondir la valeur. Les nombres entiers
  // (dont 0) restent tels quels : « 0,00 » + une touche tapée au bout donnerait « 0,002 », soit 0.
  if (/^€/.test(suffix || '') && /^-?\d+,\d$/.test(v)) v = `${v}0`;
  return html`<div class="relative ${cls}">
    <input class="input ${suffix ? 'pr-12' : ''} tabular-nums" name="${name}" inputmode="${inputmode}" autocomplete="off" placeholder="${placeholder}" value="${v}" data-num ${min !== undefined ? raw(`data-min="${esc(min)}"`) : ''} data-step="${step}" ${attrList(attrs)}/>
    ${suffix ? html`<span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-[13px] text-slate-500">${suffix}</span>` : ''}
  </div>`;
}

function inputText(name, value, { placeholder = '', attrs = null, cls = '', type = 'text', maxlength = 120 } = {}) {
  const extra = { autocomplete: 'off', ...(attrs || {}) };
  return html`<input class="input ${cls}" type="${type}" name="${name}" value="${value ?? ''}" placeholder="${placeholder}" maxlength="${maxlength}" ${attrList(extra)}/>`;
}

function selectInput(name, options, value, { attrs = null, cls = '' } = {}) {
  return html`<div class="relative ${cls}">
    <select class="input appearance-none pr-10" name="${name}" ${attrList(attrs)}>
      ${options.map((o) => html`<option value="${o.value ?? ''}" ${String(o.value ?? '') === String(value ?? '') ? raw('selected') : ''} ${o.disabled ? raw('disabled') : ''}>${o.label}</option>`)}
    </select>
    <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-500">${icon('ChevronDown', 'w-4 h-4')}</span>
  </div>`;
}

function segmented(name, options, value, { action = 'segment', cls = '' } = {}) {
  return html`<div class="inline-flex rounded-xl border border-white/10 bg-ink-900/80 p-1 ${cls}" role="tablist">
    ${options.map((o) => html`<button type="button" role="tab" aria-selected="${o.value === value}" data-action="${action}" data-name="${name}" data-value="${o.value}"
      class="h-8 rounded-lg px-3 text-[13px] font-medium transition ${o.value === value ? 'bg-ink-700 text-slate-50 shadow-[inset_0_1px_0_rgba(255,255,255,.06)]' : 'text-slate-400 hover:text-slate-200'}">${o.label}</button>`)}
  </div>`;
}

function spoolDisc(hex, pct = 100, status = 'ok', size = 48) {
  const c = safeHex(hex);
  const r = 21;
  const circ = 2 * Math.PI * r;
  const ring = status === 'ok' ? '#22F2A0' : status === 'low' ? '#FBBF24' : '#F43F5E';
  return raw(`<svg viewBox="0 0 48 48" width="${size}" height="${size}" aria-hidden="true" class="shrink-0">
    <circle cx="24" cy="24" r="${r}" fill="none" stroke="rgba(148,163,184,.15)" stroke-width="3"/>
    <circle cx="24" cy="24" r="${r}" fill="none" stroke="${ring}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(circ * clamp(pct, 0, 100)) / 100} ${circ}" transform="rotate(-90 24 24)"/>
    <circle cx="24" cy="24" r="15" fill="${c}"/>
    <circle cx="24" cy="24" r="15" fill="url(#p3dSpoolShade)"/>
    <circle cx="24" cy="24" r="5.5" fill="#0A0E13" stroke="rgba(255,255,255,.18)"/>
  </svg>`);
}

function colorDots(materials, size = 'h-3 w-3') {
  const list = Array.isArray(materials) ? materials : [];
  if (!list.length) return html`<span class="text-[12px] text-slate-500">Aucune matière</span>`;
  return html`<span class="inline-flex -space-x-1">${list.slice(0, 6).map((m) => html`<span class="${size} rounded-full ring-2 ring-ink-900" style="background:${safeHex(m.color_hex)};box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)"></span>`)}</span>`;
}

function layeredThumb(materials, photo, cls = 'h-full w-full') {
  if (photo && /^data:image\/(png|jpe?g|webp);base64,/i.test(photo)) {
    return html`<img src="${photo}" alt="" class="${cls} object-contain" loading="lazy"/>`;
  }
  // Vignette par défaut : une pièce imprimée couche par couche, aux couleurs des matières
  const colors = (Array.isArray(materials) && materials.length ? materials : [{ color_hex: '#334358' }]).map((m) => safeHex(m.color_hex));
  const n = 10;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const c = colors[Math.floor((i / n) * colors.length)];
    const [r, g, b] = hexToRgb(c);
    const dark = 0.2126 * r + 0.7152 * g + 0.0722 * b < 60;
    const w = 46 + 34 * Math.sin(((i + 0.5) / n) * Math.PI);
    rows.push(`<rect x="${((100 - w) / 2).toFixed(1)}" y="${8 + i * 8.6}" width="${w.toFixed(1)}" height="6.4" rx="3.2" fill="${c}"${dark ? ' stroke="rgba(255,255,255,.28)" stroke-width="0.9"' : ''} opacity="${(0.6 + (i / n) * 0.4).toFixed(2)}"/>`);
  }
  return raw(`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" class="${esc(cls)}" aria-hidden="true"><ellipse cx="50" cy="96" rx="40" ry="3" fill="rgba(34,242,160,.12)"/>${rows.join('')}</svg>`);
}

function emptyCard({ icon: ic = 'Sparkles', title, text, actions = '' }) {
  return html`<div class="card flex flex-col items-center px-6 py-12 text-center">
    <div class="mb-4 grid h-14 w-14 place-items-center rounded-2xl border border-neon/20 bg-neon/5 text-neon">${icon(ic, 'w-7 h-7')}</div>
    <h3 class="font-display text-lg font-semibold text-slate-100">${title}</h3>
    <p class="mt-1 max-w-sm text-sm text-slate-400">${text}</p>
    ${actions ? html`<div class="mt-5 flex flex-wrap justify-center gap-2">${actions}</div>` : ''}
  </div>`;
}

function pageHeader(title, subtitle, actions = '') {
  return html`<div class="mb-5 flex flex-wrap items-end justify-between gap-3 pt-5 lg:pt-8">
    <div class="min-w-0">
      <h1 class="font-display text-[26px] font-bold leading-tight tracking-tight text-slate-50 lg:text-3xl">${title}</h1>
      ${subtitle ? html`<p class="mt-1 text-sm text-slate-400">${subtitle}</p>` : ''}
    </div>
    ${actions ? html`<div class="flex flex-wrap gap-2">${actions}</div>` : ''}
  </div>`;
}

function statRow(label, value, { tone = '', strong = false, cls = '' } = {}) {
  return html`<div class="flex items-center justify-between gap-3 py-1.5 ${cls}">
    <span class="text-[13px] text-slate-400">${label}</span>
    <span class="tabular-nums ${strong ? 'font-display text-base font-semibold' : 'text-sm font-medium'} ${tone || 'text-slate-100'}">${value}</span>
  </div>`;
}

function costBar(parts) {
  const segs = parts.filter((p) => p.value > 0);
  const total = sum(segs, (p) => p.value);
  if (total <= 0) return html`<div class="h-2 rounded-full bg-white/5"></div>`;
  return html`<div class="flex h-2 overflow-hidden rounded-full bg-white/5">${segs.map((p) => html`<div style="width:${((p.value / total) * 100).toFixed(2)}%;background:${p.color}" title="${p.label}"></div>`)}</div>`;
}

const COST_COLORS = { material: '#22F2A0', purge: '#10B981', hardware: '#A78BFA', machine: '#22D3EE', labor: '#F59E0B', other: '#64748B', fees: '#F472B6', failures: '#F43F5E' };

/* ---------- lecture des formulaires ---------- */
function readForm(root) {
  const out = {};
  for (const el of $$('input[name], select[name], textarea[name]', root)) {
    if (el.type === 'checkbox') out[el.name] = el.checked;
    else if (el.type === 'radio') {
      if (el.checked) out[el.name] = el.value;
    } else if (el.hasAttribute('data-num')) out[el.name] = el.value.trim() === '' ? null : parseNum(el.value);
    else out[el.name] = el.value;
  }
  return out;
}

function setFieldError(root, name, message) {
  const el = root.querySelector(`[name="${name}"]`);
  if (!el) return;
  const wrap = el.closest('label') || el.parentElement;
  let msg = wrap.querySelector('.field-error');
  if (!message) {
    el.classList.remove('input-error');
    if (msg) msg.remove();
    return;
  }
  el.classList.add('input-error');
  if (!msg) {
    msg = document.createElement('span');
    msg.className = 'field-error mt-1 block text-[12px] text-rose-300';
    wrap.appendChild(msg);
  }
  msg.textContent = message;
}

/* ---------- notifications ---------- */
function toast(message, { tone = 'ok', title = '', timeout = 4200 } = {}) {
  const root = $('#toast-root');
  if (!root) return;
  const t = TONES[tone] || TONES.ok;
  const ic = tone === 'ok' ? 'CircleCheck' : tone === 'bad' ? 'CircleAlert' : tone === 'warn' ? 'CloudOff' : 'Info';
  const el = document.createElement('div');
  el.setAttribute('role', tone === 'bad' ? 'alert' : 'status');
  el.className = `toast pointer-events-auto flex w-full max-w-md items-start gap-3 rounded-2xl border ${t.border} bg-ink-850/95 p-3.5 shadow-2xl shadow-black/50 backdrop-blur`;
  el.innerHTML = String(html`<span class="mt-0.5 ${t.text}">${icon(ic, 'w-5 h-5')}</span>
    <div class="min-w-0 flex-1">${title ? html`<div class="text-sm font-semibold text-slate-100">${title}</div>` : ''}<div class="text-[13px] leading-snug text-slate-300">${message}</div></div>
    <button class="hit -m-1 shrink-0 rounded-lg p-1 text-slate-400 hover:text-slate-200" aria-label="Fermer">${icon('X', 'w-4 h-4')}</button>`);
  const close = () => {
    el.classList.add('toast-out');
    setTimeout(() => el.remove(), 220);
  };
  el.querySelector('button').addEventListener('click', close);
  root.appendChild(el);
  if (timeout) setTimeout(close, tone === 'bad' ? Math.max(timeout, 8000) : timeout);
}

// Bouton principal dont l'action prend du temps (envoi à la base) : anneau de chargement après 150 ms,
// bouton non recliquable jusqu'à la fin (pas d'anneau pour les actions instantanées)
function withBusy(el, result) {
  if (!result || typeof result.then !== 'function' || !el || !el.matches || !el.matches('.btn-primary, .btn[data-action="submit"]')) return result;
  const timer = setTimeout(() => {
    el.classList.add('is-busy');
    el.setAttribute('aria-busy', 'true');
  }, 150);
  const done = () => {
    clearTimeout(timer);
    el.classList.remove('is-busy');
    el.removeAttribute('aria-busy');
  };
  result.then(done, (e) => {
    done();
    console.error('[paulo3d] action interrompue', e);
  });
  return result;
}

// Annonce honnête du résultat d'une action
async function runOp(type, payload, { success = 'Enregistré' } = {}) {
  const res = await Sync.enqueue(type, payload);
  if (res.state === 'confirmed' && res.tombstoned) {
    toast('Cet élément avait déjà été supprimé sur un autre appareil : rien n’a été enregistré.', { tone: 'warn', title: 'Action ignorée' });
    return res;
  }
  if (res.state === 'confirmed') {
    toast(success, { tone: 'ok' });
    return res;
  }
  if (res.state === 'queued') {
    if (res.slow) toast("La base répond lentement : l'action est gardée sur cet appareil et sera envoyée dès que possible.", { tone: 'warn', title: 'Envoi en cours' });
    else toast("Pas de connexion : l'action est gardée sur cet appareil. Elle partira automatiquement au retour du réseau.", { tone: 'warn', title: "En attente d'envoi" });
    return res;
  }
  toast(res.error.message, { tone: 'bad', title: res.state === 'failed' ? 'Refusé par la base' : 'Non enregistré' });
  return res;
}
const opAccepted = (res) => res.state === 'confirmed' || res.state === 'queued';

/* ---------- fenêtres (bottom sheet sur téléphone, boîte au centre sur PC) ---------- */
const Modal = {
  stack: [],

  open({ title, subtitle = '', size = 'md', render, onMount, onInput, actions = {}, onClose, refreshOnStore = false }) {
    const widths = { sm: 'sm:max-w-md', md: 'sm:max-w-xl', lg: 'sm:max-w-3xl', xl: 'sm:max-w-5xl' };
    const wrap = document.createElement('div');
    wrap.className = 'modal fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-6';
    wrap.innerHTML = `<div class="modal-backdrop absolute inset-0 bg-black/70 backdrop-blur-sm" data-close></div>
      <div class="modal-panel relative flex max-h-[94dvh] w-full flex-col overflow-hidden rounded-t-3xl border border-white/10 bg-ink-900 shadow-2xl shadow-black/60 sm:rounded-3xl ${widths[size] || widths.md}" role="dialog" aria-modal="true">
        <div class="flex items-start justify-between gap-3 border-b border-white/[0.06] px-5 pb-3 pt-4">
          <div class="min-w-0"><div class="mx-auto mb-2 h-1 w-10 rounded-full bg-white/15 sm:hidden"></div>
            <h2 class="font-display text-lg font-semibold text-slate-50" data-title></h2>
            <p class="text-[13px] text-slate-400" data-subtitle></p></div>
          <button class="btn btn-ghost h-9 w-9 shrink-0 rounded-xl" data-close aria-label="Fermer">${icon('X', 'w-5 h-5')}</button>
        </div>
        <div class="modal-body flex-1 overflow-y-auto overscroll-contain px-5 py-4" data-body></div>
        <div class="modal-footer hidden border-t border-white/[0.06] bg-ink-900/95 px-5 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]" data-footer></div>
      </div>`;
    document.getElementById('modal-root').appendChild(wrap);
    document.body.classList.add('overflow-hidden');

    const m = {
      el: wrap,
      data: {},
      actions,
      refreshOnStore,
      q: (sel) => wrap.querySelector(sel),
      qa: (sel) => [...wrap.querySelectorAll(sel)],
      body: wrap.querySelector('[data-body]'),
      setTitle(t, s = '') {
        wrap.querySelector('[data-title]').textContent = t;
        wrap.querySelector('[data-subtitle]').textContent = s;
      },
      render() {
        const out = render(m);
        const scroll = m.body.scrollTop;
        if (out && typeof out === 'object' && !(out instanceof Raw) && 'body' in out) {
          m.body.innerHTML = String(out.body);
          const f = wrap.querySelector('[data-footer]');
          f.innerHTML = out.footer ? String(out.footer) : '';
          f.classList.toggle('hidden', !out.footer);
        } else {
          m.body.innerHTML = String(out);
        }
        m.body.scrollTop = scroll;
      },
      update(sel, content) {
        const el = wrap.querySelector(sel);
        if (el) el.innerHTML = String(content);
      },
      close(result) {
        if (m.closed) return;
        m.closed = true;
        wrap.classList.add('modal-out');
        Modal.stack = Modal.stack.filter((x) => x !== m);
        setTimeout(() => {
          wrap.remove();
          if (!Modal.stack.length) document.body.classList.remove('overflow-hidden');
        }, 180);
        if (onClose) onClose(result);
      },
    };
    m.setTitle(title, subtitle);
    wrap.addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) {
        m.close();
        return;
      }
      const a = e.target.closest('[data-action]');
      if (a && m.actions[a.dataset.action]) {
        e.preventDefault();
        e.stopPropagation();
        withBusy(a, m.actions[a.dataset.action](a, e, m));
      }
    });
    if (onInput) {
      wrap.addEventListener('input', (e) => onInput(e, m));
      wrap.addEventListener('change', (e) => onInput(e, m));
    }
    wrap.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') m.close();
      if (e.key === 'Enter' && e.target.tagName === 'INPUT' && m.actions.submit) {
        e.preventDefault();
        m.actions.submit(e.target, e, m);
      }
    });
    Modal.stack.push(m);
    m.render();
    if (onMount) onMount(m);
    requestAnimationFrame(() => {
      const first = wrap.querySelector('[autofocus]');
      if (first && window.matchMedia('(pointer: fine)').matches) first.focus();
    });
    return m;
  },

  refreshAll() {
    for (const m of Modal.stack) if (m.refreshOnStore && typeof m.refreshOnStore === 'function') m.refreshOnStore(m);
  },
};

function confirmBox({ title, message, confirm = 'Confirmer', tone = 'danger', icon: ic = 'TriangleAlert' }) {
  return new Promise((resolve) => {
    let answered = false;
    Modal.open({
      title,
      size: 'sm',
      render: () => ({
        body: html`<div class="flex gap-3"><span class="mt-0.5 ${tone === 'danger' ? 'text-rose-300' : 'text-amber-300'}">${icon(ic, 'w-6 h-6')}</span><p class="text-sm leading-relaxed text-slate-300">${message}</p></div>`,
        footer: html`<div class="flex justify-end gap-2">${btn('Annuler', { variant: 'ghost', action: 'no' })}${btn(confirm, { variant: tone === 'danger' ? 'danger' : 'primary', action: 'yes' })}</div>`,
      }),
      actions: {
        yes: (el, e, m) => {
          answered = true;
          m.close();
          resolve(true);
        },
        no: (el, e, m) => m.close(),
      },
      onClose: () => {
        if (!answered) resolve(false);
      },
    });
  });
}

const NAV = [
  { name: 'dashboard', hash: '#/', label: 'Dashboard', short: 'Dashboard', icon: 'LayoutDashboard' },
  { name: 'bobines', hash: '#/bobines', label: 'Bobines', short: 'Bobines', icon: 'Disc3' },
  { name: 'templates', hash: '#/templates', label: 'Templates', short: 'Templates', icon: 'Layers' },
  { name: 'stock', hash: '#/stock', label: 'Stock & Ventes', short: 'Stock', icon: 'Store' },
  { name: 'parametres', hash: '#/parametres', label: 'Paramètres', short: 'Paramètres', icon: 'Settings' },
];

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const params = Object.fromEntries(new URLSearchParams(qs || ''));
  const name = path || 'dashboard';
  return { name, params };
}

function go(hash) {
  if (location.hash === hash) App.render();
  else location.hash = hash;
}

const Actions = {};
const VIEWS = {};

const App = {
  route: { name: 'dashboard', params: {} },
  charts: [],
  queued: false,
  ui: lsGet(LS.ui, {}) || {},
  mounted: false,

  saveUi() {
    lsSet(LS.ui, Object.fromEntries(Object.entries(this.ui).filter(([k]) => !k.endsWith('Draft'))));
  },

  start() {
    this.route = parseHash();
    if (!this.mounted) {
      this.mountShell();
      Store.subscribe(() => this.schedule());
      Sync.subscribe(() => this.updateChrome());
      window.addEventListener('hashchange', () => {
        this.route = parseHash();
        this.routeChanged = true;
        this.render();
        window.scrollTo({ top: 0 });
      });
      document.addEventListener('click', (e) => {
        const a = e.target.closest('[data-action]');
        if (!a || a.closest('.modal')) return;
        const fn = Actions[a.dataset.action];
        if (fn) {
          e.preventDefault();
          withBusy(a, fn(a, e));
        }
      });
      document.addEventListener('input', (e) => {
        const el = e.target.closest('[data-page-input]');
        if (el && Actions[el.dataset.pageInput]) Actions[el.dataset.pageInput](el, e);
      });
      this.mounted = true;
    }
    this.render();
  },

  // requestAnimationFrame est suspendu quand la fenêtre est cachée : minuterie de secours
  schedule() {
    if (this.queued) return;
    this.queued = true;
    const run = () => {
      if (!this.queued) return;
      this.queued = false;
      this.render();
      Modal.refreshAll();
    };
    requestAnimationFrame(run);
    setTimeout(run, 80);
  },

  mountShell() {
    const root = $('#app');
    root.innerHTML = String(html`

    `);
  },

  render() {
    for (const c of this.charts) {
      try {
        c.destroy();
      } catch { /* déjà détruit */ }
    }
    this.charts = [];
    const view = VIEWS[this.route.name] || VIEWS.dashboard;
    const main = $('#view');
    if (!main) return;
    const active = document.activeElement;
    const keep = active && main.contains(active) && active.dataset.keep ? { key: active.dataset.keep, start: active.selectionStart, end: active.selectionEnd } : null;
    main.innerHTML = String(view.render(Store.V, this.route));
    // changement d'écran (pas un simple rafraîchissement des données) : apparition douce
    if (this.routeChanged) {
      this.routeChanged = false;
      main.classList.remove('view-enter');
      void main.offsetWidth;
      main.classList.add('view-enter');
    }
    if (keep) {
      const el = main.querySelector(`[data-keep="${keep.key}"]`);
      if (el) {
        el.focus();
        try {
          el.setSelectionRange(keep.start, keep.end);
        } catch { /* champ sans sélection */ }
      }
    }
    if (view.mount) view.mount(Store.V, this.route);
    this.updateChrome();

        <span class="max-w-[9.5rem] truncate sm:max-w-none">${s.label}</span></button>`);

        footer: html`<div class="flex justify-end gap-2">${btn('Fermer', { variant: 'ghost', action: 'close' })}${btn('Synchroniser maintenant', { variant: 'primary', icon: 'RefreshCw', action: 'now' })}</div>`,

/* ---------- téléchargement / partage de fichiers ---------- */
async function saveFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  try {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iphone|ipad|android/i.test(navigator.userAgent)) {
      await navigator.share({ files: [file], title: filename });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function dayHeader(iso) {
  const d = new Date(iso);
  const today = new Date();
  const k = dayKey(iso);
  if (k === dayKey(today.toISOString())) return "Aujourd'hui";
  if (k === dayKey(new Date(today.getTime() - DAY).toISOString())) return 'Hier';
  return `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS_LONG[d.getMonth()]}${d.getFullYear() !== today.getFullYear() ? ` ${d.getFullYear()}` : ''}`;
}

let chartThemed = false;
function applyChartTheme() {
  if (chartThemed || !globalThis.Chart) return;
  Chart.defaults.color = '#94A3B8';
  Chart.defaults.borderColor = 'rgba(148,163,184,.1)';
  Chart.defaults.font.family = 'Inter, ui-sans-serif, system-ui, sans-serif';
  Chart.defaults.font.size = 11;
  Chart.defaults.plugins.tooltip.backgroundColor = '#0D1218';
  Chart.defaults.plugins.tooltip.borderColor = 'rgba(255,255,255,.1)';
  Chart.defaults.plugins.tooltip.borderWidth = 1;
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.titleColor = '#F1F5F9';
  Chart.defaults.plugins.tooltip.bodyColor = '#CBD5E1';
  // animations réduites demandées par le téléphone : graphiques affichés directement
  if (globalThis.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) Chart.defaults.animation = false;
  chartThemed = true;
}

function fadeFill(rgb) {
  return (ctx) => {
    const { chart } = ctx;
    const area = chart.chartArea;
    if (!area) return `rgba(${rgb},0.08)`;
    const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, `rgba(${rgb},0.28)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    return g;
  };
}

Actions['event-open'] = (el) => {
  const { type, id } = el.dataset;
  const V = Store.V;
  if (type === 'sale') return openSaleDetails(id);
  if (type === 'production' || type === 'failure') return openProductionDetails(id);
  if (type === 'spool') {
    const sp = V.spools.get(id);
    return sp ? openSpoolHistory(sp) : toast('Cette bobine a été supprimée.', { tone: 'info' });
  }
  if (type === 'weigh') {
    const m = V.spool_movements.get(id);
    const sp = m && V.spools.get(m.spool_id);
    return sp ? openSpoolHistory(sp) : null;
  }
  App.ui.stockTab = 'pieces';
  App.saveUi();
  go('#/stock');
};

VIEWS.historique = {

    const period = App.ui.histPeriod || 'all';

    const shown = events.slice(0, limit);

      </div>
      ${events.length ? html`<div class="space-y-4">${[...days.entries()].map(([k, list]) => html`<section>
          <h3 class="mb-1.5 px-1 text-[12px] font-semibold uppercase tracking-wide text-slate-500">${dayHeader(list[0].date)}</h3>

  },
};
