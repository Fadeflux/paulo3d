  </div>`;
}

// Bilan en PDF (A4) : chiffres clés, puis les tableaux ; en-têtes répétés à chaque nouvelle page
function reportPdf(V, r) {
  const doc = pdfDocument(`Balanço de ${r.range.label}`);
  const M = 40;
  const W = doc.W - 2 * M;
  const TOP = 48;
  const BOTTOM = doc.H - 50;
  const GRAY = '#6b7280';
  const DARK = '#374151';
  let y = TOP;
  doc.page();
  doc.text(`Balanço de ${r.range.label}`, M, y + 14, { size: 18, bold: true, maxWidth: W });
  doc.text(`${r.st.workshop_name} · impresso a ${fmtDate(new Date().toISOString(), 'long')}`, M, y + 31, { size: 9, color: GRAY, maxWidth: W });
  y += 46;
  const kpis = reportKpis(r);
  const gap = 8;
  const kw = (W - 3 * gap) / 4;
  const kh = 38;
  kpis.forEach(([label, value], i) => {
    const x = M + (i % 4) * (kw + gap);
    const ky = y + Math.floor(i / 4) * (kh + gap);
    doc.rect(x, ky, kw, kh, { stroke: '#e5e7eb', width: 0.8, radius: 5 });
    doc.text(label, x + 8, ky + 14, { size: 7.5, color: GRAY, maxWidth: kw - 16 });
    doc.text(value, x + 8, ky + 30, { size: 12.5, bold: true, maxWidth: kw - 16 });
  });
  y += Math.ceil(kpis.length / 4) * (kh + gap);

  const size = 8;
  const lh = 10;
  const pad = 4;
  for (const t of reportTables(V, r)) {
    if (!t.rows.length && !t.empty) continue;
    const scale = W / t.cols.reduce((a, c) => a + c[1], 0);
    const cols = t.cols.map(([label, w, kind]) => ({ label, w: w * scale, kind }));
    const at = (c, x) => (c.kind === 'num' ? x + c.w - pad : x + pad);
    const head = () => {
      let x = M;
      for (const c of cols) {
        doc.text(c.label, at(c, x), y + 9, { size: 7.5, bold: true, color: DARK, align: c.kind === 'num' ? 'right' : 'left', maxWidth: c.w - 2 * pad });
        x += c.w;
      }
      y += 13;
      doc.line(M, y, M + W, y, { color: '#9ca3af', width: 0.9 });
    };
    // titre de section jamais seul en bas de page
    if (y + 60 > BOTTOM) {
      doc.page();
      y = TOP;
    }
    y += 18;
    doc.text(t.title.toUpperCase(), M, y, { size: 9, bold: true, color: DARK });
    y += 4;
    if (!t.rows.length) {
      doc.text(t.empty, M, y + 12, { size: 8.5, color: GRAY });
      y += 16;
      continue;
    }
    head();
    const row = (cells, bold) => {
      const lines = cells.map((v, i) => (cols[i].kind === 'wrap' ? pdfWrap(v, cols[i].w - 2 * pad, size, bold, 3) : [String(v ?? '')]));
      const h = Math.max(...lines.map((l) => l.length)) * lh + 5;
      if (y + h > BOTTOM) {
        doc.page();
        y = TOP;
        head();
      }
      if (bold) doc.line(M, y, M + W, y, { color: '#9ca3af', width: 0.9 });
      let x = M;
      cols.forEach((c, i) => {
        // un montant n'est JAMAIS coupé : aligné à droite, il déborde plutôt sur la marge de la colonne voisine
        for (const [j, ln] of lines[i].entries()) doc.text(ln, at(c, x), y + 10 + j * lh, { size, bold, align: c.kind === 'num' ? 'right' : 'left', maxWidth: c.kind === 'num' ? 0 : c.w - 2 * pad });
        x += c.w;
      });
      y += h;
      if (!bold) doc.line(M, y, M + W, y, { color: '#e5e7eb', width: 0.5 });
    };
    for (const cells of t.rows) row(cells, false);
    if (t.total) row(t.total, true);
  }

  const formula = pdfWrap(REPORT_FORMULA, W, 7.5);
  if (y + 22 + formula.length * 10 > BOTTOM) {
    doc.page();
    y = TOP;
  }
  y += 22;
  for (const ln of formula) {
    doc.text(ln, M, y, { size: 7.5, color: GRAY });
    y += 10;
  }
  const n = doc.pageCount;
  for (let i = 0; i < n; i++) {
    doc.usePage(i);
    doc.text(`${SITE.name} · Balanço de ${r.range.label}`, M, doc.H - 26, { size: 7.5, color: GRAY });
    doc.text(`Página ${i + 1}/${n}`, doc.W - M, doc.H - 26, { size: 7.5, color: GRAY, align: 'right' });
  }
  return doc.output();
}

// Impression directe du navigateur. Sur iPhone en appli installée (écran d'accueil),
// window.print() ne fait RIEN : seul le PDF est alors proposé.
function canPrint() {
  if (typeof window.print !== 'function') return false;
  const ua = navigator.userAgent;
  const ios = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || (typeof matchMedia === 'function' && matchMedia('(display-mode: standalone)').matches);
  return !(ios && standalone);
}

// Imprime un contenu seul (la page de l'appli est masquée pendant l'impression, classe pr-on).
// La feuille reste en place jusqu'au changement d'écran : sur certains téléphones, l'aperçu
// est préparé APRÈS l'évènement afterprint (l'effacer à ce moment imprimerait une page blanche).
function printSheet(content) {
  let root = document.getElementById('print-root');
  if (!root) {
    root = document.createElement('div');
    root.id = 'print-root';
    document.body.appendChild(root);
    window.addEventListener('hashchange', () => {
      root.innerHTML = '';
      document.documentElement.classList.remove('pr-on');
    });
  }
  root.innerHTML = String(content);
  document.documentElement.classList.add('pr-on');
  window.print();
}

// Crée le PDF puis le partage (téléphone : Imprimer, Enregistrer, envoyer…) ou le télécharge (ordinateur)
async function sharePdf(filename, build) {
  let pdf;
  try {
    pdf = build();
  } catch (e) {
    console.error(`[${SITE.id}] PDF`, e);
    toast("Não foi possível criar o PDF. Tenta de novo daqui a pouco.", { tone: 'bad' });
    return false;
  }
  return saveFile(filename, pdf, 'application/pdf');
}

function makeQr(text) {
  if (!globalThis.qrcode) return null;
  try {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr;
  } catch {
    return null;
  }
}
function qrSvg(text) {
  const qr = makeQr(text);
  return qr ? qr.createSvgTag({ cellSize: 3, margin: 0, scalable: true }) : '';
}

// Planche A4 : 2 × 7 étiquettes de 93 × 37 mm, pointillés de découpe
const LABEL_GRID = { cols: 2, rows: 7 };
function labelsPdf(V, ids, linkOf = spoolLink) {
  const doc = pdfDocument("Etiquetas das bobinas");
  const { cols, rows } = LABEL_GRID;
  const mx = 10 * MM;
  const my = 10 * MM;
  const gx = 4 * MM;
  const gy = 3 * MM;
  const lw = (doc.W - 2 * mx - gx) / cols;
  const lh = (doc.H - 2 * my - (rows - 1) * gy) / rows;
  const pad = 3 * MM;
  const qs = lh - 2 * pad;
  labelSpools(V, ids).forEach((s, i) => {
    const k = i % (cols * rows);
    if (k === 0) doc.page();
    const x = mx + (k % cols) * (lw + gx);
    const y = my + Math.floor(k / cols) * (lh + gy);
    doc.rect(x, y, lw, lh, { stroke: '#9ca3af', width: 0.6, dash: [3, 2], radius: 2.5 * MM });
    const code = makeQr(linkOf(s.id));
    if (code) doc.qr(code, x + pad, y + pad, qs);
    const tx = x + pad + qs + 4 * MM;
    const tw = x + lw - pad - tx;
    doc.circle(tx + 4.5, y + pad + 9, 4.2, { fill: safeHex(s.color_hex), stroke: '#6b7280', width: 0.5 });
    doc.text(s.color_name || "Sem nome", tx + 12, y + pad + 13, { size: 12, bold: true, maxWidth: tw - 12 });
    doc.text([s.brand, s.material].filter(Boolean).join(' · '), tx, y + pad + 29, { size: 9, color: '#374151', maxWidth: tw });
    doc.text(labelPrice(s), tx, y + pad + 42, { size: 9, color: '#374151', maxWidth: tw });
    if (s.purchased_at) doc.text(`Compra: ${fmtPlainDate(s.purchased_at)}`, tx, y + pad + 55, { size: 8, color: '#6b7280', maxWidth: tw });
    doc.text("Lê para pesar", tx, y + lh - pad - 2, { size: 7.5, color: '#6b7280', maxWidth: tw });
  });
  return doc.output();
}

/* ---------- scanner une étiquette avec la caméra, DANS l'appli ---------- */
// Sur iPhone, l'appareil photo ouvre les liens dans Safari, pas dans l'appli installée (qui a sa propre
// mémoire : il faudrait s'y reconnecter). Le bouton « Scanner » lit l'étiquette sans quitter l'appli.
const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
const JSQR_SRI = "sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx";
const canScan = () => !!(typeof navigator !== 'undefined' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

// Identifiant de bobine dans le lien d'une étiquette (…#/bobines?peser=<id>) ; rien d'autre n'est lu
function spoolIdFromLabel(text) {
  const m = /[#&?]peser=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?![0-9a-f-])/i.exec(String(text || ''));
  return m ? m[1].toLowerCase() : null;
}

function cameraError(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return "Acesso à câmara recusado. Autoriza-o nas definições do navegador (no iPhone: Definições → Safari → Câmara) e tenta de novo.";
  if (n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'DevicesNotFoundError') return "Nenhuma câmara encontrada neste aparelho.";
  if (n === 'NotReadableError') return "A câmara já está a ser usada por outra aplicação: fecha-a e tenta de novo.";
  return "Não foi possível ligar a câmara.";
}

function openScanner() {
  const st = { stream: null, timer: 0, closed: false, lastOther: '' };
  const say = (m, text, bad = false) => {
    const p = m.q('[data-scan-msg]');
    if (!p) return;
    p.textContent = text;
    p.className = `text-[13px] ${bad ? 'text-rose-300' : 'text-slate-400'}`;
  };
  const stop = () => {
    st.closed = true;
    clearTimeout(st.timer);
    if (st.stream) for (const t of st.stream.getTracks()) t.stop();
    st.stream = null;
  };
  const found = (m, id) => {
    stop();
    m.close();
    const s = Store.V.spools.get(id);
    if (s) openWeighModal(s);
    else toast("Bobina não encontrada neste aparelho (eliminada, ou ainda não sincronizada).", { tone: 'warn' });
  };
  const start = async (m) => {
    try {
      if (!globalThis.jsQR) await loadScript(JSQR_URL, JSQR_SRI);
    } catch {
      return say(m, "Leitor de código QR indisponível: é preciso internet da primeira vez.", true);
    }
    if (st.closed) return;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (e) {
      return say(m, cameraError(e), true);
    }
    // fenêtre fermée pendant l'autorisation : on rend la caméra tout de suite
    if (st.closed) {
      for (const t of stream.getTracks()) t.stop();
      return;
    }
    st.stream = stream;
    const video = m.q('video');
    video.srcObject = stream;
    try {
      await video.play();
    } catch { /* lecture automatique : la vidéo démarre quand même (muette) */ }
    say(m, "Aponta para o código QR da etiqueta.");
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const tick = () => {
      if (st.closed) return;
      const w = video.videoWidth;
      const h = video.videoHeight;
      if (w && h) {
        const k = Math.min(1, 720 / Math.max(w, h));
        canvas.width = Math.round(w * k);
        canvas.height = Math.round(h * k);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = globalThis.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) {
          const id = spoolIdFromLabel(code.data);
          if (id) return found(m, id);
          if (code.data !== st.lastOther) {
            st.lastOther = code.data;
            say(m, "Este código QR não é uma etiqueta de bobina.", true);
          }
        }
      }
      st.timer = setTimeout(tick, 160);
    };
    tick();
  };
  Modal.open({
    title: "Ler uma etiqueta",
    subtitle: "A pesagem da bobina abre-se logo",
    size: 'md',
    render: () => ({

VIEWS.bobines.mount = function mountBobines(V, route) {
  const id = route.params.peser;
  if (!id) return;
  history.replaceState(null, '', '#/bobines');
  App.route = parseHash();
  const open = () => {
    const s = Store.V.spools.get(id);
    if (s) openWeighModal(s);
    else toast("Bobina não encontrada neste aparelho (eliminada, ou ainda não sincronizada).", { tone: 'warn' });
  };
  if (Store.V.spools.has(id) || Sync.state.firstPullDone || !Sync.backend || Sync.backend.kind !== 'supabase') return open();
  // appareil qui démarre : on attend la première synchronisation (30 s au plus, hors-ligne elle ne vient pas)
  let timer = null;
  const off = Sync.subscribe((st) => {
    if (!st.firstPullDone && !Store.V.spools.has(id)) return;
    off();
    clearTimeout(timer);
    open();
  });
  timer = setTimeout(() => {
    off();
    open();
  }, 30000);
};

/* =============================================================================
   Écrans d'accueil : configuration Supabase, connexion, compte
   ============================================================================= */

function decodeJwtPayload(token) {
  try {
    const part = String(token).split('.')[1];
    return JSON.parse(b64urlDecode(part));
  } catch {
    return null;
  }
}

// Refuse les clés secrètes : elles donnent tous les droits et ne doivent jamais aller dans une page web
function keyProblem(key) {
  const k = String(key || '').trim();
  if (!k) return "Cola a chave pública do projeto.";
  if (/^sb_secret_/i.test(k)) return "Esta é a chave SECRETA: nunca a ponhas numa página web. Usa a chave «publishable» (ou «anon»).";
  if (/^eyJ/.test(k)) {
    const p = decodeJwtPayload(k);
    if (p && p.role === 'service_role') return "Esta é a chave «service_role» (secreta): nunca a ponhas numa página web. Usa a chave «anon».";
    return null;
  }
  if (/^sb_publishable_/i.test(k)) return null;
  return "Esta chave não tem o formato esperado (começa por «sb_publishable_» ou «eyJ»).";
}

async function testSupabase(url, key) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const headers = { apikey: key };
    if (/^eyJ/.test(key)) headers.Authorization = `Bearer ${key}`;
    const res = await fetch(`${url}/auth/v1/settings`, { headers, signal: ctrl.signal });
    if (res.status === 401 || res.status === 403) return { ok: false, message: "Chave recusada pelo Supabase: verifica se copiaste a chave pública DESTE projeto." };
    if (!res.ok) return { ok: false, message: `O Supabase responde, mas com um erro (HTTP ${res.status}). O projeto pode estar em pausa: abre-o no painel do Supabase.` };
    const body = await res.json().catch(() => ({}));
    return { ok: true, signupDisabled: body.disable_signup === true };
  } catch (e) {
    return { ok: false, network: true, message: e && e.name === 'AbortError' ? "O Supabase não responde (tempo esgotado)." : "Endereço inacessível: verifica o URL do projeto e a tua ligação à internet." };
  } finally {
    clearTimeout(timer);
  }
}

// Même règle que le projet Supabase (Authentication → Sign In / Providers → Email) :
// 12 caractères minimum avec minuscule, majuscule, chiffre et symbole (liste de symboles de Supabase)
const PASSWORD_MIN = 12;
const PASSWORD_MAX = 72; // limite de Supabase (bcrypt)
const PASSWORD_RULE = `pelo menos ${PASSWORD_MIN} caracteres com uma minúscula, uma maiúscula, um algarismo e um símbolo (! ? @ # $ % & * …)`;
function passwordProblem(pw) {
  const p = String(pw || '');
  if (p.length < PASSWORD_MIN) return `Demasiado curta: ${PASSWORD_RULE}.`;
  // Supabase compte en octets : une lettre accentuée en vaut deux
  if (new TextEncoder().encode(p).length > PASSWORD_MAX) return `Demasiado longa: ${PASSWORD_MAX} caracteres no máximo (uma letra acentuada conta a dobrar).`;
  const missing = [];
  if (!/[a-z]/.test(p)) missing.push("uma minúscula");
  if (!/[A-Z]/.test(p)) missing.push("uma maiúscula");
  if (!/[0-9]/.test(p)) missing.push("um algarismo");
  if (!/[!@#$%^&*()_+\-=[\]{};'\\:"|<>?,./`~]/.test(p)) missing.push("um símbolo (! ? @ # $ % & * …)");
  return missing.length ? `Falta ${missing.join(', ')}.` : null;
}

function authErrorMessage(error) {
  const msg = String((error && error.message) || '');
  const code = String((error && (error.code || error.error_code)) || '');
  if (/invalid login credentials/i.test(msg) || code === 'invalid_credentials') return "Email ou palavra-passe incorretos.";
  if (/email not confirmed/i.test(msg) || code === 'email_not_confirmed') return "Endereço ainda não confirmado: clica na ligação recebida por email e depois inicia sessão.";
  if (/banned/i.test(msg) || code === 'user_banned') return "Esta conta está bloqueada.";
  if (/invalid totp|mfa_verification_failed/i.test(`${msg} ${code}`)) return "Código incorreto: escreve o código que aparece NESTE MOMENTO na tua aplicação (muda a cada 30 segundos).";
  if (code === 'mfa_challenge_expired' || /challenge.*expired/i.test(msg)) return "O código expirou: tenta de novo com o novo código.";
  if (code === 'insufficient_aal' || /aal2 (is )?required|insufficient.*aal/i.test(msg)) return "Por segurança, inicia sessão de novo com o teu código antes de fazer isto.";
  if (/mfa.*(not enabled|disabled)|enroll.*not enabled/i.test(`${msg} ${code}`)) return "A autenticação de dois fatores não está ativada no projeto Supabase (Authentication → Multi-Factor → TOTP).";
  if (code === 'too_many_enrolled_mfa_factors' || /too many enrolled/i.test(msg)) return "Demasiados códigos pendentes nesta conta: remove-os no Supabase (Authentication → Users) e tenta de novo.";
  if (/friendly name/i.test(msg) || code === 'mfa_factor_name_conflict') return "Já há uma ativação em curso: fecha esta janela e recomeça.";
  if (/signups? not allowed|signup(s)? (are )?disabled/i.test(msg) || code === 'signup_disabled') return "As inscrições estão fechadas neste projeto (de propósito, por segurança). A conta cria-se no Supabase: Authentication → Users → Add user.";
  if (/email address.*not authorized/i.test(msg) || code === 'email_address_not_authorized') return "O Supabase não consegue enviar emails para este endereço (o envio gratuito do Supabase está reservado aos membros do projeto). A palavra-passe pode ser alterada a partir do painel do Supabase.";
  if (/should be different|same password/i.test(msg) || code === 'same_password') return "A nova palavra-passe tem de ser diferente da anterior.";
  if (/reauthenticat/i.test(msg) || code === 'reauthentication_needed') return "Por segurança, termina a sessão e volta a iniciá-la antes de mudar a palavra-passe.";
  if (/longer than 72/i.test(msg)) return `Palavra-passe demasiado longa: ${PASSWORD_MAX} caracteres no máximo.`;
  if (/password should be|weak password|password.*(contain|characters)/i.test(msg) || code === 'weak_password') return `Palavra-passe demasiado fraca: ${PASSWORD_RULE}.`;
  if (/rate limit|too many/i.test(msg) || code === 'over_email_send_rate_limit' || code === 'over_request_rate_limit') return "Demasiadas tentativas: espera alguns minutos antes de tentar de novo.";
  if (/abort/i.test(msg)) return "O Supabase não responde (tempo esgotado). Verifica a ligação à internet e tenta de novo.";
  if (/fetch|network|load failed/i.test(msg)) return "Sem ligação ao Supabase. Verifica a internet.";
  return msg || "Erro desconhecido.";
}

const Screens = {
  el() {
    let el = document.getElementById('screen');
    if (!el) {
      el = document.createElement('div');
      el.id = 'screen';

      document.body.appendChild(el);
    }
    return el;
  },

  hide() {
    const el = document.getElementById('screen');
    if (el) el.remove();
    const splash = document.getElementById('splash');
    if (splash) splash.remove();
    const app = document.getElementById('app');
    if (app) {
      app.inert = false;
      app.removeAttribute('aria-hidden');
    }
  },

  frame(content) {
    const el = this.el();
    el.innerHTML = String(html`<div class="auth-bg"></div>
      <div class="relative mx-auto flex min-h-full w-full max-w-md flex-col justify-center px-5 py-10 pt-[max(2.5rem,env(safe-area-inset-top))]">

    // l'application derrière l'écran de connexion n'est ni lisible ni atteignable au clavier
    const app = document.getElementById('app');
    if (app) {
      app.inert = true;
      app.setAttribute('aria-hidden', 'true');

    };
    el.querySelector('#pw-toggle').addEventListener('click', (e) => {

    el.querySelector('#change-base').addEventListener('click', () => this.setup({ fromSettings: false }));
    const forgot = el.querySelector('#forgot');
    if (forgot) {
      forgot.addEventListener('click', async () => {
        const email = form.email.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show("Indica primeiro o teu email acima.");
        forgot.disabled = true;
        const { error } = await backend.sb.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}${location.pathname}` });
        forgot.disabled = false;
        if (error) return show(authErrorMessage(error));
        show("Se esta conta existir, acabou de ser enviado um email com uma ligação para redefinir. Abre-o neste aparelho.", 'info');
      });
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim().toLowerCase();
      const password = form.password.value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show("Email inválido.");
      if (!password) return show("Indica a palavra-passe.");
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      show("A iniciar sessão…", 'info');
      try {
        const { data, error } = await backend.sb.auth.signInWithPassword({ email, password });
        if (error) return show(authErrorMessage(error));
        lsSet(lsKey('last_email'), email);
        if (relogin && Store.userId && data.user.id !== Store.userId) {
          toast("Sessão iniciada com outra conta: as ações em espera da conta anterior ficam guardadas para ela.", { tone: 'warn' });
        }
        const factorId = await Mfa.factorToVerify(backend);
        if (factorId) return Screens.mfa({ backend, user: data.user, factorId });
        await Boot.enter(backend, data.user);
      } catch (err) {
        show(authErrorMessage(err));
      } finally {
        button.disabled = false;
      }
    });
    if (window.matchMedia('(pointer: fine)').matches) (lastEmail ? form.password : form.email).focus();
  },
};

function openNewPasswordModal({ title = "Nova palavra-passe" } = {}) {

  if (!backend || backend.kind !== 'supabase') return;
  Modal.open({
    title,
    size: 'sm',
    render: () => ({
      body: html`<div class="space-y-4">
        ${field("Nova palavra-passe", html`<input class="input" type="password" name="p1" autocomplete="new-password" maxlength="${PASSWORD_MAX}" placeholder="${PASSWORD_MIN} caracteres no mínimo" autofocus/>`, { hint: `Pelo menos ${PASSWORD_MIN} caracteres, com minúscula, maiúscula, algarismo e símbolo.` })}
        ${field("Confirmar", html`<input class="input" type="password" name="p2" autocomplete="new-password" maxlength="${PASSWORD_MAX}"/>`)}
      </div>`,
      footer: html`<div class="flex justify-end gap-2">${btn("Cancelar", { variant: 'ghost', action: 'cancel' })}${btn("Guardar", { variant: 'primary', icon: 'Check', action: 'submit' })}</div>`,
    }),
    actions: {
      cancel: (el, e, m) => m.close(),
      submit: async (el, e, m) => {
        const f = readForm(m.el);
        const problem = passwordProblem(f.p1);
        if (problem) return setFieldError(m.el, 'p1', problem);
        if (f.p1 !== f.p2) return setFieldError(m.el, 'p2', "As palavras-passe não coincidem.");
        el.disabled = true;
        const { error } = await backend.sb.auth.updateUser({ password: f.p1 });
        el.disabled = false;
        if (error) return toast(authErrorMessage(error), { tone: 'bad', title: "Palavra-passe não alterada" });
        toast("Palavra-passe alterada", { tone: 'ok' });
        m.close();
      },
    },
  });
}

/* ==== 82-mfa.js ==== */
/* =============================================================================
   Double authentification : un code à 6 chiffres, affiché par une appli gratuite
   (Google Authenticator, Microsoft Authenticator, 2FAS…), en plus du mot de passe.
   La base refuse toute donnée à une session « mot de passe seul » d'un compte qui l'a
   activée (p3d_private.mfa_ok) : l'appli demande le code à la connexion, et si besoin
   pendant la synchronisation (code activé sur un autre appareil).
   ============================================================================= */

const Mfa = {
  // état affiché dans Paramètres (rechargé après connexion, activation ou désactivation)
  info: { loaded: false, loading: false, factor: null, error: '' },

  reset() {
    this.info = { loaded: false, loading: false, factor: null, error: '' };
  },

  async load(backend) {
    if (!backend || backend.kind !== 'supabase' || this.info.loading) return;
    this.info.loading = true;
    try {
      const { data, error } = await backend.sb.auth.mfa.listFactors();
      if (error) throw error;
      this.info = { loaded: true, loading: false, factor: (data && data.totp && data.totp[0]) || null, error: '' };
    } catch (e) {
      const offline = classifyError(wrapError(e, e && e.status)) === 'network';
      this.info = { loaded: true, loading: false, factor: null, error: offline ? "Sem ligação: não foi possível verificar o estado da autenticação de dois fatores." : authErrorMessage(e) };
    }
    if (App.mounted && App.route.name === 'parametres') App.render();
  },

  // Code exigé pour cette session ? Renvoie l'identifiant du facteur à vérifier, sinon null.
  // Lecture locale (la session garde la liste des facteurs) : marche aussi hors-ligne.
  async factorToVerify(backend) {
    try {
      const { data, error } = await backend.sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (error || !data || data.currentLevel === 'aal2' || data.nextLevel !== 'aal2') return null;
      const { data: s } = await backend.sb.auth.getSession();
      const f = ((s && s.session && s.session.user && s.session.user.factors) || []).find((x) => x.status === 'verified' && x.factor_type === 'totp');
      return f ? f.id : null;
    } catch {
      return null;
    }
  },

  // Facteur à vérifier quand la BASE a réclamé le code (activé ailleurs : la session l'ignore encore)
  async factorFromServer(backend) {
    const { data, error } = await backend.sb.auth.mfa.listFactors();
    if (error) throw error;
    const f = data && data.totp && data.totp[0];
    return f ? f.id : null;
  },

  async verify(backend, factorId, code) {
    const { error } = await backend.sb.auth.mfa.challengeAndVerify({ factorId, code });
    return error || null;
  },
};

// Le QR code de Supabase est un SVG brut placé derrière « data:… ,» : on l'encode pour qu'aucun
// caractère (#, %, guillemets) ne coupe l'image
function qrDataUrl(qr) {
  const s = String(qr || '');
  const i = s.indexOf(',');
  if (!s.startsWith('data:') || i < 0) return '';
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(decodeURIComponentSafe(s.slice(i + 1)))}`;
}
function decodeURIComponentSafe(s) {
  try {
    return decodeURIComponent(s);
  } catch {
    return s;
  }
}

  if (!backend || backend.kind !== 'supabase') return;

        ${qr ? html`<img src="${qr}" alt="Código QR a ler com a aplicação de autenticação" class="mx-auto h-48 w-48 rounded-xl bg-white p-2"/>` : ''}
        <details class="rounded-xl bg-white/[0.03] p-3"><summary class="cursor-pointer text-slate-400">Não consegues ler (aplicação no mesmo telemóvel)?</summary>
          <p class="mt-2">Escolhe «Introduzir uma chave» na aplicação e copia:</p>
          <p class="mt-1 select-all break-all font-mono text-[14px] text-slate-100">${secret.replace(/(.{4})/g, '$1 ').trim()}</p></details>

      </div>`,
      footer: html`<div class="flex justify-end gap-2">${btn("Cancelar", { variant: 'ghost', action: 'cancel' })}${btn("Ativar", { variant: 'primary', icon: 'ShieldCheck', action: 'submit' })}</div>`,
    }),
    actions: {
      cancel: (el, e, m) => m.close(),
      submit: async (el, e, m) => {
        const code = readCode(m.el);
        if (!/^\d{6}$/.test(code)) return setFieldError(m.el, 'code', "O código tem 6 algarismos.");
        const err = await Mfa.verify(backend, factorId, code);
        if (err) return setFieldError(m.el, 'code', authErrorMessage(err));
        done = true;
        m.close();
        toast("Autenticação de dois fatores ativada: o código será pedido em cada novo início de sessão.", { tone: 'ok', title: "Conta protegida" });

  });
}

function seededRandom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

    Store.S = emptyState();
    Store.meta = { lastPull: {}, lastReconcile: 0 };
    Store.markMeta();
    for (const t of TABLES) Store.dirty.add(t);
    await Store.persistSnapshotNow();
    Store.rebuild(true);
    await Sync.kick(true);
    toast("Demo esvaziada", { tone: 'ok' });
  },
};

/* ==== 90-boot.js ==== */
/* =============================================================================
   Démarrage
   ============================================================================= */

const Boot = {
  backend: null,
  authSub: null,
  loggingOut: false,
  updateRequested: false,
  updateOffered: false,
  notifierBound: false,

  async start() {
    // Jamais utilisable à l'intérieur d'un autre site (piège à clics) : GitHub Pages ne permet pas
    // d'interdire les cadres par en-tête, l'appli refuse donc elle-même de démarrer dans un cadre.
    if (this.framed()) return Screens.framed();
    // Lien de configuration collé dans un onglet où l'appli est déjà ouverte : un simple changement après
    // « # » ne recharge pas la page, on recharge donc pour le traiter comme à l'ouverture (confirmation).
    window.addEventListener('hashchange', () => {
      if (/[#&/]setup=/.test(location.hash)) location.reload();
    });
    this.captureInstallPrompt();
    this.registerServiceWorker();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    const link = this.readSetupLink();
    if (link) return this.confirmSetupLink(link);
    await this.route();
  },

  framed() {
    try {
      return window.top !== window.self;
    } catch {
      return true;
    }
  },

  async route() {
    const mode = lsGet(LS.mode, null);
    if (mode === 'demo') return this.startDemo();
    const cfg = lsGet(LS.supa, null);
    if (!cfg || !cfg.url || !cfg.key) return Screens.setup();
    return this.startSupabase(cfg);
  },

  async restart() {
    Sync.stop();
    if (this.authSub) {
      try {
        this.authSub.unsubscribe();
      } catch { /* déjà désabonné */ }
      this.authSub = null;
    }
    Store.close();
    this.backend = null;
    await this.route();
  },

  async startSupabase(cfg) {
    if (!globalThis.supabase || typeof supabase.createClient !== 'function') {
      return Screens.fatal("Não foi possível carregar o módulo Supabase. Verifica a ligação à internet e recarrega: depois de aberta uma vez com internet, a aplicação também funciona offline.");
    }
    let backend;
    try {
      backend = new SupabaseBackend(cfg.url, cfg.key);
    } catch (e) {
      console.error(e);
      return Screens.setup();
    }
    this.backend = backend;
    const { data: sub } = backend.sb.auth.onAuthStateChange((event, session) => this.onAuth(event, session));
    this.authSub = sub && sub.subscription;

    let user = null;
    try {
      const { data, error } = await backend.sb.auth.getSession();
      if (data && data.session) user = data.session.user;
      else if (error && classifyError(wrapError(error, error.status)) === 'network') user = this.storedUser(backend);
    } catch {
      user = this.storedUser(backend);
    }
    if (!user && navigator.onLine === false) user = this.storedUser(backend);
    if (!user) return Screens.login();
    // double authentification activée et session « mot de passe seul » (appli fermée sur l'écran du code)
    const factorId = await Mfa.factorToVerify(backend);
    if (factorId) return Screens.mfa({ backend, user, factorId });
    return this.enter(backend, user);
  },

  // Hors-ligne avec un jeton expiré : on garde l'accès à la copie locale, la reconnexion se fera au retour du réseau
  storedUser(backend) {
    try {
      const raw = localStorage.getItem(`${SITE.prefix}-auth-${backend.ref}`);
      if (!raw) return null;
      const s = JSON.parse(raw);
      const sess = s && (s.currentSession || s);
      return sess && sess.user && sess.user.id ? sess.user : null;
    } catch {
      return null;
    }
  },

  async enter(backend, user) {
    backend.userId = user.id;
    backend.email = user.email || '';
    Mfa.reset();
    await Store.open(`${backend.ref}:${user.id}`, user.id);
    Screens.hide();
    App.start();
    Sync.start(backend);
    this.bindNotifier();
  },

  async startDemo() {
    const backend = new DemoBackend();
    await backend.load();
    this.backend = backend;
    await Store.open('demo', backend.userId);
    Screens.hide();
    App.start();
    Sync.start(backend);
    this.bindNotifier();
    // Première ouverture : la démo est remplie d'exemples (c'est ce que promet l'écran d'accueil).
    // Une seule fois : après « Vider la démo », elle reste vide.
    if (!lsGet(LS.demoSeeded, false) && ['spools', 'templates', 'productions', 'sales'].every((t) => backend.S[t].size === 0)) {
      try {
        await Demo.seed();
        lsSet(LS.demoSeeded, true);
      } catch (e) {
        // la démo reste utilisable (vide ou partielle) ; « Remplir avec des exemples » reste possible dans Paramètres
        console.error(`[${SITE.id}] exemples de démo non ajoutés`, e);
        toast("Não foi possível adicionar os exemplos da demo (memória do aparelho cheia?).", { tone: 'warn' });
      }
    }
  },

  bindNotifier() {
    if (this.notifierBound) return;
    this.notifierBound = true;
    Sync.subscribe((state) => {
      if (state.flushing) return;
      if (Sync.confirmedWhileAway > 0) {
        const n = Sync.confirmedWhileAway;
        Sync.confirmedWhileAway = 0;
        toast(pl(n, "1 ação em espera está agora guardada na base de dados.", `${fmtNum(n)} ações em espera estão agora guardadas na base de dados.`), { tone: 'ok', title: "Sincronizado" });
      }
      if (Sync.skippedWhileAway > 0) {
        const n = Sync.skippedWhileAway;
        Sync.skippedWhileAway = 0;
        toast(pl(n, "1 ação em espera não registou nada: o elemento tinha sido eliminado noutro aparelho.", `${fmtNum(n)} ações em espera não registaram nada: os elementos tinham sido eliminados noutro aparelho.`), { tone: 'warn', title: "Ação ignorada" });
      }
      if (Sync.failedWhileAway > 0) {
        const n = Sync.failedWhileAway;
        Sync.failedWhileAway = 0;
        toast(pl(n, "1 ação foi recusada pela base de dados. Abre a sincronização para ver porquê.", `${fmtNum(n)} ações foram recusadas pela base de dados. Abre a sincronização para ver porquê.`), { tone: 'bad', title: "Ação recusada" });
      }
    });
  },

  onAuth(event, session) {
    const b = this.backend;
    if (!b || b.kind !== 'supabase') return;
    if (event === 'PASSWORD_RECOVERY') {
      setTimeout(() => openNewPasswordModal({ title: "Escolhe uma nova palavra-passe" }), 400);
      return;
    }
    if (event === 'SIGNED_OUT' && !this.loggingOut && b.userId) {
      Sync.state.needsLogin = true;
      Sync.emit();
      App.updateChrome();
      return;
    }
    if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session && b.userId && session.user.id === b.userId && Sync.state.needsLogin) {
      Sync.state.needsLogin = false;
      Sync.kick();
    }
    // code de double authentification validé (écran de connexion ou fenêtre « Code de sécurité »)
    if (event === 'MFA_CHALLENGE_VERIFIED' && b.userId && Sync.state.needsMfa) {
      Sync.state.needsMfa = false;
      Sync.kick();
    }
  },

  async logout() {
    const b = this.backend;
    this.loggingOut = true;
    Sync.stop();
    try {
      if (b && b.kind === 'supabase') await b.sb.auth.signOut({ scope: 'local' });
    } catch { /* hors-ligne : la session locale est effacée quand même */ }
    this.loggingOut = false;
    Store.close();
    Store.S = emptyState();
    Store.Q = [];
    Store.rebuild(true);
    if (b) b.userId = null;
    Mfa.reset();
    Screens.login();
  },

  async clearLocal() {
    const name = Store.dbName;
    Sync.stop();
    Store.close();
    if (name) await IDB.clearAll(name);
    location.reload();
  },

  readSetupLink() {
    const m = location.hash.match(/[#&/]setup=([A-Za-z0-9_-]+)/);
    if (!m) return null;
    history.replaceState(null, '', `${location.pathname}${location.search}#/`);
    try {
      const obj = JSON.parse(b64urlDecode(m[1]));
      const url = normalizeSupaUrl(obj.u);
      const key = String(obj.k || '').trim();
      if (!url || keyProblem(key)) return null;
      return { url, key };
    } catch {
      return null;
    }
  },

  // Un lien de configuration peut venir de n'importe qui : on montre la base visée avant de l'adopter
  confirmSetupLink(link) {
    const current = lsGet(LS.supa, null);
    if (current && current.url === link.url && current.key === link.key) return this.route();
    const el = Screens.frame(html`<div class="card p-5 sm:p-6">
      <h1 class="font-display text-xl font-bold text-slate-50">Configurar este aparelho?</h1>
      <p class="mt-2 text-sm text-slate-400">Esta ligação liga a aplicação à base de dados:</p>
      <p class="mt-2 break-all rounded-xl bg-white/[0.04] p-3 font-mono text-[13px] text-slate-100">${link.url}</p>
      ${current ? html`<p class="mt-3 text-[13px] text-amber-300">Atenção: este aparelho está atualmente ligado a ${current.url}.</p>` : ''}
      <p class="mt-3 text-[13px] text-slate-400">Só aceites se esta ligação vier de ti (definições da tua aplicação, no teu outro aparelho).</p>
      <div class="mt-5 flex gap-2"><button class="btn btn-ghost h-11 flex-1 rounded-xl" id="link-no">Recusar</button><button class="btn btn-primary h-11 flex-1 rounded-xl" id="link-yes">Usar esta base de dados</button></div>
    </div>`);
    el.querySelector('#link-yes').addEventListener('click', async () => {
      lsSet(LS.supa, link);
      lsSet(LS.mode, 'supabase');
      await this.restart();
    });
    el.querySelector('#link-no').addEventListener('click', () => this.route());
  },

  captureInstallPrompt() {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      App.installPrompt = e;
      if (App.mounted && App.route.name === 'parametres') App.render();
    });
    window.addEventListener('appinstalled', () => {
      App.installPrompt = null;
      toast("Aplicação instalada", { tone: 'ok' });
    });
  },

  registerServiceWorker() {
    if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!this.updateRequested || this.reloading) return;
      this.reloading = true;
      location.reload();
    });
    const register = () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        const offer = (w) => {
          if (w && navigator.serviceWorker.controller) this.offerUpdate(w);
        };
        if (reg.waiting) offer(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          if (w) w.addEventListener('statechange', () => {
            if (w.state === 'installed') offer(w);
          });
        });
        setInterval(() => reg.update().catch(() => {}), 60 * 60000);
        this.checkOfflineCache();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') this.checkOfflineCache();
        });
      }).catch((e) => console.warn(`[${SITE.id}] service worker non installé`, e));
    };
    if (document.readyState === 'complete') register();
    else window.addEventListener('load', register);
  },

  // Un autre site à la même adresse peut vider tous les caches du navigateur (son service worker
  // supprime ce qui n'est pas à lui) : sans réparation, l'appli ne s'ouvrirait plus sans réseau.
  // Dès qu'elle est ouverte avec du réseau, la copie hors-ligne est reconstituée.
  async checkOfflineCache() {
    try {
      if (navigator.onLine === false || !globalThis.caches) return;
      const reg = await navigator.serviceWorker.ready;
      if (!reg.active || reg.waiting) return;
      // ⚠️ Le cache peut EXISTER et être VIDE : le service worker le recrée (vide) à chaque
      // requête via caches.open(), et une réparation ratée (4G faible) laisse aussi un cache
      // vide. Tester son existence ne réparait donc presque jamais : on vérifie qu'il contient
      // la page de l'appli — exactement ce que le service worker sert hors-ligne.
      const shell = await caches.open(`${SITE.prefix}-shell-${APP_VERSION}`);
      if ((await shell.match('./index.html')) || (await shell.match('./'))) return;
      reg.active.postMessage({ type: 'RECACHE', version: APP_VERSION });
    } catch { /* vérification facultative */ }
  },

  offerUpdate(worker) {
    // une version encore plus récente peut arriver avant le clic : elle remplace celle proposée
    // d'abord (qui devient caduque et ignorerait la demande de mise à jour)
    this.pendingWorker = worker;
    if (this.updateOffered) return;
    this.updateOffered = true;
    const bar = document.createElement('div');
    bar.className = 'fixed inset-x-0 top-0 z-[70] flex justify-center px-3 pt-[max(0.75rem,env(safe-area-inset-top))]';
    bar.innerHTML = String(html`<div class="flex items-center gap-3 rounded-2xl border border-neon/30 bg-ink-850/95 py-2 pl-4 pr-2 shadow-2xl shadow-black/50 backdrop-blur">
      ${icon('Sparkles', 'w-4 h-4 text-neon')}<span class="text-sm text-slate-200">Nova versão disponível</span>
      <button class="btn btn-primary h-8 rounded-lg px-3 text-[13px]" data-update>Atualizar</button>
      <button class="grid h-8 w-8 place-items-center text-slate-500 hover:text-slate-200" data-dismiss aria-label="Mais tarde">${icon('X', 'w-4 h-4')}</button>
    </div>`);
    bar.querySelector('[data-update]').addEventListener('click', async () => {
      this.updateRequested = true;
      const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
      const target = (reg && reg.waiting) || this.pendingWorker;
      if (target) target.postMessage({ type: 'SKIP_WAITING' });
      setTimeout(() => location.reload(), 4000);
    });
    bar.querySelector('[data-dismiss]').addEventListener('click', () => bar.remove());
    document.body.appendChild(bar);
  },
};

if (typeof document !== 'undefined') {
  const go0 = () => Boot.start().catch((e) => {
    console.error(`[${SITE.id}] démarrage impossible`, e);
    Screens.fatal(`Não foi possível arrancar: ${e && e.message ? e.message : e}`);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go0);
  else go0();
}
