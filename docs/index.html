/* ---------- lancer une production / déclarer un print raté ---------- */
// quantity : nombre de pièces prérempli (commande) ; onDone : appelé une fois la production acceptée
function openProductionModal({ kind = 'production', templateId = null, quantity = null, onDone = null }) {
  const V0 = Store.V;
  const templates = valuesOf(V0.templates).filter((t) => !t.archived || t.id === templateId).sort((a, b) => a.name.localeCompare(b.name, SITE.lang));
  if (!templates.length) {
    Modal.open({
      title: kind === 'failure' ? "Declarar uma impressão falhada" : "Lançar uma produção",
      size: 'sm',
      render: () => emptyCard({ icon: 'Layers', title: "Cria primeiro um modelo", text: "A produção parte de um modelo: materiais, gramas e tempo.", actions: btn("Novo modelo", { variant: 'primary', icon: 'Plus', action: 'new-tpl' }) }),
      actions: { 'new-tpl': (el, e, m) => { m.close(); openTemplateModal({}); } },
    });
    return;
  }
  const first = (templateId && V0.templates.get(templateId)) || templates[0];
  const d = {
    kind,
    templateId: first.id,
    quantity: kind === 'failure' ? 1 : isPieceCount(quantity) ? toNum(quantity) : Math.max(1, toNum(first.pieces_per_print, 1)),
    failedPct: 100,
    reason: FAILURE_REASONS[0],
    machineId: first.machine_id || '',
    spoolIds: null,
    occurredAt: toLocalInput(),
    note: '',
    showMore: false,
    busy: false,
  };

  const currentTemplate = () => Store.V.templates.get(d.templateId) || first;

  const initSpools = () => {
    const V = Store.V;
    const t = currentTemplate();
    const q = Math.max(1, Math.round(toNum(d.quantity, 1)));
    const lines = Array.isArray(t.materials) ? t.materials : [];
    const gramsModel = sum(lines, (l) => l.grams);
    d.spoolIds = lines.map((l) => {
      const need = (toNum(l.grams) + (gramsModel > 0 ? toNum(t.purge_g) * (toNum(l.grams) / gramsModel) : 0)) * q;
      const s = suggestSpool(V, l, need);
      return s ? s.id : null;
    });
  };
  initSpools();

  const plan = () => planProduction(Store.V, {
    template: currentTemplate(),
    kind: d.kind,
    quantity: isPieceCount(d.quantity) ? toNum(d.quantity) : Math.max(1, Math.round(toNum(d.quantity, 1))),
    failedPct: d.failedPct,
    machineId: d.machineId || null,
    spoolIds: d.spoolIds,
    // date non modifiée : heure exacte de la validation (la saisie ne va qu'à la minute)
    occurredAt: d.dateEdited ? fromLocalInput(d.occurredAt) : new Date().toISOString(),
    note: d.note,
    reason: d.reason,
  });

  const summaryBlock = () => {
    const { payload: p, warnings } = plan();
    const isFail = d.kind === 'failure';
    return html`<div class="rounded-2xl border ${isFail ? 'border-rose-500/20 bg-rose-500/[0.04]' : 'border-neon/20 bg-neon/[0.04]'} p-4">
      <div class="flex items-end justify-between gap-3">
        <div><div class="text-[12px] font-medium text-slate-400">${isFail ? "Perda registada" : "Custo de produção total"}</div>
          <div class="font-display text-3xl font-bold tabular-nums ${isFail ? 'text-rose-300' : 'text-slate-50'}">${fmtEur(p.total_cost)}</div></div>
        ${isFail ? '' : html`<div class="text-right"><div class="text-[12px] text-slate-400">por peça</div><div class="font-display text-xl font-bold tabular-nums text-neon">${fmtEur(p.unit_cost)}</div></div>`}
      </div>
      <div class="mt-3 grid grid-cols-2 gap-x-4">
        ${statRow("Filamento", fmtG(p.grams_total))}
        ${statRow("Tempo de máquina", fmtDuration(p.print_time_min_total))}
        ${statRow("Material + purga", fmtEur(p.material_cost + p.purge_cost))}
        ${statRow("Máquina", fmtEur(p.machine_cost))}
        ${isFail ? '' : statRow("Ferragens", fmtEur(p.hardware_cost))}
        ${isFail ? '' : statRow("Main-d'œuvre", fmtEur(p.labor_cost))}
      </div>
      ${warnings.length ? html`<div class="mt-3 space-y-1.5">${warnings.map((w) => html`<p class="flex gap-2 text-[12px] text-amber-200">${icon('TriangleAlert', 'w-4 h-4 shrink-0')}<span>${w.type === 'spool_short'
        ? `Restam ${fmtG(Math.max(0, w.have))} em «${spoolLabel(w.spool)}», são precisos ${fmtG(w.need)}. Fica registado na mesma: pesa a bobina depois.`
        : `Sem bobina para ${w.line.material} ${w.line.color_name || ''}: é usado o custo médio, nada é descontado.`}</span></p>`)}</div>` : ''}
    </div>`;
  };

  const spoolsBlock = () => {
    const V = Store.V;
    const t = currentTemplate();
    const lines = Array.isArray(t.materials) ? t.materials : [];
    if (!lines.length) return html`<p class="text-[13px] text-slate-500">Este modelo não tem nenhum material: só contam o tempo de máquina e a mão de obra.</p>`;
    const q = Math.max(1, Math.round(toNum(d.quantity, 1)));
    const k = d.kind === 'failure' ? clamp(toNum(d.failedPct, 100), 1, 100) / 100 : 1;
    const gramsModel = sum(lines, (l) => l.grams);
    return html`<div class="space-y-2">${lines.map((l, i) => {
      const need = (toNum(l.grams) + (gramsModel > 0 ? (toNum(t.purge_g) * toNum(l.grams)) / gramsModel : 0)) * q * k;
      const cands = candidateSpools(V, l, { needGrams: need });
      const opts = [{ value: '', label: "Nenhuma (custo médio, nada descontado)" }, ...cands.map((c) => ({ value: c.spool.id, label: `${c.close ? '● ' : ''}${c.spool.color_name || "Sem nome"}${c.spool.brand ? ` · ${c.spool.brand}` : ''} — ${fmtG(Math.max(0, toNum(c.spool.remaining_weight_g)))}${c.enough ? '' : ' ⚠'}` }))];
      const chosen = d.spoolIds[i];
      if (chosen && !cands.some((c) => c.spool.id === chosen)) {
        const s = V.spools.get(chosen);
        if (s) opts.push({ value: s.id, label: `${spoolLabel(s)} — ${fmtG(s.remaining_weight_g)}` });
      }
      const s = chosen ? V.spools.get(chosen) : null;
      return html`<div class="rounded-2xl border border-white/[0.06] bg-ink-850 p-3">
        <div class="mb-2 flex items-center justify-between gap-2">
          <span class="flex min-w-0 items-center gap-2 text-sm text-slate-200"><span class="h-3.5 w-3.5 shrink-0 rounded-full ring-1 ring-white/20" style="background:${safeHex(l.color_hex)}"></span><span class="truncate">${l.material} ${l.color_name || ''}</span></span>
          <span class="font-display text-sm font-semibold tabular-nums text-slate-100">${fmtG(need)}</span>
        </div>
        ${selectInput('spool', opts, chosen || '', { attrs: { 'data-line': i } })}
        ${s ? html`<div class="mt-1.5 flex items-center justify-between text-[12px]"><span class="text-slate-500">Depois: ${fmtG(toNum(s.remaining_weight_g) - need)}</span>${toNum(s.remaining_weight_g) - need < settingsOf(V).spool_critical_g ? html`<span class="text-amber-300">bobina quase vazia</span>` : ''}</div>` : ''}
      </div>`;
    })}</div>`;
  };

  Modal.open({
    title: kind === 'failure' ? "Declarar uma impressão falhada" : "Lançar uma produção",
    subtitle: kind === 'failure' ? "O filamento é descontado, a perda contada, nenhum stock criado" : "O filamento é descontado e as peças juntas ao stock",
    size: 'lg',
    render: () => {
      const t = currentTemplate();
      const V = Store.V;
      const isFail = d.kind === 'failure';
      return {
        body: html`<div class="grid gap-5 lg:grid-cols-2">
          <div class="space-y-4">
            ${field("Modelo", selectInput('templateId', templates.map((x) => ({ value: x.id, label: x.archived ? `${x.name} (arquivado)` : x.name })), d.templateId))}
            <div class="flex items-center gap-3 rounded-2xl border border-white/[0.06] bg-ink-850 p-3">
              <div class="h-14 w-14 shrink-0 overflow-hidden rounded-xl bg-ink-900 p-1">${layeredThumb(t.materials, t.photo)}</div>
              <div class="min-w-0 flex-1 text-[12px] text-slate-400"><div class="truncate text-sm font-semibold text-slate-100">${t.name}</div>${fmtG(templateCost(V, t).grams)} · ${fmtDuration(t.print_time_min)} por peça · stock atual ${fmtNum(stockForTemplate(V, t.id))}</div>
            </div>
            <div>
              <span class="label">${isFail ? "Peças falhadas" : "Quantidade de peças"}</span>
              <div class="flex items-center gap-2">
                ${btn('', { size: 'icon', icon: 'Minus', action: 'qty-minus', title: "Menos" })}
                ${inputNum('quantity', d.quantity, { placeholder: '1', inputmode: 'numeric', cls: 'w-24 [&_input]:text-center [&_input]:font-display [&_input]:text-lg' })}
                ${btn('', { size: 'icon', icon: 'Plus', action: 'qty-plus', title: 'Plus' })}
                ${toNum(t.pieces_per_print) > 1 && !isFail ? html`<span class="text-[12px] text-slate-500">${plural(Math.ceil(toNum(d.quantity) / toNum(t.pieces_per_print)), "base", "bases")}</span>` : ''}
              </div>
            </div>
            ${isFail ? html`<div>
              <div class="flex items-center justify-between"><span class="label">Parou a</span><span class="font-display text-sm font-semibold text-rose-300" id="pct-label">${fmtNum(d.failedPct)} %</span></div>
              <input type="range" name="failedPct" min="5" max="100" step="5" value="${d.failedPct}" class="range w-full"/>
              <p class="mt-1 text-[12px] text-slate-500">Só a parte impressa é descontada (filamento e tempo de máquina).</p>
            </div>
            <div><span class="label">Causa</span><div class="flex flex-wrap gap-1.5">${FAILURE_REASONS.map((r) => html`<button data-action="reason" data-value="${r}" aria-pressed="${d.reason === r}" class="chip ${d.reason === r ? 'chip-active' : ''}">${r}</button>`)}</div></div>` : ''}
            ${field("Máquina", selectInput('machineId', machineOptions(V, d.machineId), d.machineId))}
            <details class="rounded-2xl border border-white/[0.06] bg-ink-850 p-3" ${d.showMore ? raw('open') : ''}>
              <summary class="cursor-pointer list-none text-sm text-slate-300">Data e nota <span class="text-slate-500">· ${fmtDate(fromLocalInput(d.occurredAt), 'long')}</span></summary>
              <div class="mt-3 space-y-3">
                ${field("Data e hora", html`<input class="input" type="datetime-local" name="occurredAt" value="${d.occurredAt}"/>`)}
                ${field("Nota", inputText('note', d.note, { placeholder: "Encomenda, definições…", maxlength: 1000 }))}
              </div>
            </details>
          </div>
          <div class="space-y-4">
            <div><h3 class="section-title mb-2">Bobinas usadas</h3><div id="prod-spools">${spoolsBlock()}</div></div>
            <div id="prod-summary">${summaryBlock()}</div>
          </div>
        </div>`,
        footer: html`<div class="flex justify-end gap-2">${btn("Cancelar", { variant: 'ghost', action: 'cancel' })}${btn(isFail ? "Registar a impressão falhada" : "Lançar a produção", { variant: isFail ? 'danger' : 'primary', icon: isFail ? 'Flame' : 'Printer', action: 'submit' })}</div>`,
      };
    },
    onInput: (e, m) => {
      const el = e.target;
      const name = el.name;
      if (!name) return;
      if (name === 'templateId' && e.type === 'change') {
        d.templateId = el.value;
        const t = currentTemplate();
        d.machineId = t.machine_id || '';
        if (d.kind === 'production') d.quantity = Math.max(1, toNum(t.pieces_per_print, 1));
        initSpools();
        m.render();
        return;
      }
      if (name === 'quantity') {
        d.quantity = parseNum(el.value);
        setFieldError(m.el, 'quantity', el.value.trim() && !isPieceCount(d.quantity) ? PIECES_ERROR : '');
      } else if (name === 'failedPct') {
        d.failedPct = +el.value;
        const lbl = m.q('#pct-label');
        if (lbl) lbl.textContent = `${d.failedPct} %`;
      } else if (name === 'spool') {
        d.spoolIds[+el.dataset.line] = el.value || null;
      } else if (name === 'machineId') {
        d.machineId = el.value;
      } else if (name === 'occurredAt') {
        d.occurredAt = el.value;
        d.dateEdited = el.value !== toLocalInput();
        d.showMore = true;
      } else if (name === 'note') {
        d.note = el.value;
        d.showMore = true;
        return;
      }
      if (e.type === 'change' || name === 'failedPct' || name === 'quantity') {
        m.update('#prod-spools', spoolsBlock());
      }
      m.update('#prod-summary', summaryBlock());
    },
    actions: {
      cancel: (el, e, m) => m.close(),
      'qty-minus': (el, e, m) => {
        d.quantity = Math.max(1, Math.round(toNum(d.quantity, 1)) - 1);
        m.render();
      },
      'qty-plus': (el, e, m) => {
        d.quantity = Math.round(toNum(d.quantity, 1)) + 1;
        m.render();
      },
      reason: (el, e, m) => {
        d.reason = el.dataset.value;
        m.render();
      },
      submit: async (el, e, m) => {
        if (d.busy) return;
        if (!isPieceCount(d.quantity)) return setFieldError(m.el, 'quantity', PIECES_ERROR);
        const q = toNum(d.quantity);
        d.busy = true;
        el.disabled = true;
        const { payload } = plan();
        const t = currentTemplate();
        const res = await runOp('production.launch', payload, {
          success: d.kind === 'failure'
            ? `Impressão falhada registada: ${fmtEur(payload.total_cost)} de perda`
            : `Produção registada: ${t.name} +${fmtNum(q)} em stock`,
        });
        d.busy = false;
        el.disabled = false;
        if (opAccepted(res)) {
          m.close();
          if (onDone) onDone();
        }
      },
    },
  });
}

/* ---------- enregistrer une vente ---------- */
// order : vente d'une commande (préremplie ; la commande passe « livrée » avec le lien vers la vente)
function openSaleModal({ templateId = null, itemName = null, order = null }) {
  const V0 = Store.V;
  const st0 = settingsOf(V0);
  const priceFor = (V, tid) => {
    const t = tid ? V.templates.get(tid) : null;
    return t ? templatePrice(V, t).price : null;
  };
  const initialGroup = stockGroups(V0).find((g) => (templateId ? g.template_id === templateId : itemName && !g.template_id && g.item_name === itemName));
  const tpl = templateId ? V0.templates.get(templateId) : null;
  const firstItem = initialGroup || tpl
    ? { key: uuid(), from_stock: true, template_id: templateId || null, item_name: initialGroup ? initialGroup.item_name : tpl.name, quantity: 1, unit_price: priceFor(V0, templateId), unit_cost: null }
    : { key: uuid(), from_stock: true, template_id: null, item_name: '', quantity: 1, unit_price: null, unit_cost: null };
  if (order) {
    firstItem.quantity = order.quantity;
    if (order.unit_price !== null && order.unit_price !== undefined) firstItem.unit_price = toNum(order.unit_price);
    if (!order.template_id && !initialGroup) {
      // pièce sur mesure, pas en stock : vendue « sur mesure » (coût de revient à saisir)
      firstItem.from_stock = false;
      firstItem.item_name = order.item_name;
    }
  }
  const d = {
    id: uuid(),
    items: [firstItem],
    channel: (order && order.channel) || lsGet(lsKey('last_channel'), 'direct'),
    customer: order ? order.customer || '' : '',
    note: '',
    shipping_charged: null,
    shipping_cost: null,
    packaging_cost: null,
    platform_fee: null,
    feeTouched: false,
    occurredAt: toLocalInput(),
    busy: false,
  };
  if (!st0.sales_channels.some((c) => c.id === d.channel)) d.channel = st0.sales_channels[0].id;

  const form = () => ({
    id: d.id,
    channel: d.channel,
    customer: d.customer,
    note: d.note,
    occurred_at: d.dateEdited ? fromLocalInput(d.occurredAt) : new Date().toISOString(),
    shipping_charged: toNum(d.shipping_charged),
    shipping_cost: toNum(d.shipping_cost),
    packaging_cost: toNum(d.packaging_cost),
    platform_fee: toNum(d.platform_fee),
    items: d.items.map((i) => ({ ...i, id: i.key, unit_price: toNum(i.unit_price), unit_cost: toNum(i.unit_cost) })),
  });

  const autoFee = () => {
    if (d.feeTouched) return;
    const V = Store.V;
    const p = planSale(V, { ...form(), platform_fee: 0 });
    const fee = channelFee(settingsOf(V), d.channel, p.amount);
    d.platform_fee = fee > 0 ? fee : null;
  };
  autoFee();

  const summaryBlock = () => {
    const V = Store.V;
    const p = planSale(V, form());
    const tone = p.net >= 0 ? 'text-neon' : 'text-rose-300';
    return html`<div class="rounded-2xl border border-cyan-400/20 bg-cyan-400/[0.04] p-4">
      ${statRow("Artigos", fmtEur(p.itemsTotal))}
      ${toNum(d.shipping_charged) > 0 ? statRow("Portes pagos pelo cliente", `+ ${fmtEur(d.shipping_charged)}`) : ''}
      ${statRow("Recebido", fmtEur(p.amount), { strong: true, tone: 'text-cyan-200' })}
      <div class="my-2 border-t border-white/[0.06]"></div>
      ${statRow("Custo de produção das peças", `− ${fmtEur(p.cogs)}`, { tone: 'text-slate-300' })}
      ${toNum(d.shipping_cost) > 0 ? statRow("Portes pagos", `− ${fmtEur(d.shipping_cost)}`, { tone: 'text-slate-300' }) : ''}
      ${toNum(d.packaging_cost) > 0 ? statRow("Embalagem", `− ${fmtEur(d.packaging_cost)}`, { tone: 'text-slate-300' }) : ''}
      ${toNum(d.platform_fee) > 0 ? statRow("Comissão", `− ${fmtEur(d.platform_fee)}`, { tone: 'text-slate-300' }) : ''}
      <div class="mt-2 flex items-end justify-between border-t border-white/[0.06] pt-3">
        <div><div class="text-[12px] font-medium text-slate-400">Margem líquida real</div><div class="font-display text-3xl font-bold tabular-nums ${tone}">${fmtEur(p.net)}</div></div>
        <div class="text-right font-display text-lg font-semibold tabular-nums ${tone}">${fmtPct(p.marginPct)}</div>
      </div>
      ${p.shortages.length ? html`<div class="mt-3 space-y-1">${p.shortages.map((s) => html`<p class="flex gap-2 text-[12px] text-rose-200">${icon('CircleAlert', 'w-4 h-4 shrink-0')}Stock insuficiente para «${s.item_name}»: faltam ${plural(s.shortage, "peça", "peças")}.</p>`)}</div>` : ''}
    </div>`;
  };

  const itemsBlock = () => {
    const V = Store.V;
    const groups = stockGroups(V).filter((g) => g.qty > 0);
    return html`<div class="space-y-2">${d.items.map((it, i) => {
      if (!it.from_stock) {
        return html`<div class="rounded-2xl border border-violet-400/20 bg-violet-500/[0.04] p-3">
          <div class="mb-2 flex items-center justify-between"><span class="text-[12px] font-semibold text-violet-200">Peça por medida (fora do stock)</span>${d.items.length > 1 ? btn('', { size: 'icon', variant: 'ghost', icon: 'X', action: 'item-remove', attrs: { 'data-i': i }, title: "Retirar", cls: 'h-8 w-8' }) : ''}</div>
          ${inputText('item_name', it.item_name, { placeholder: "Descrição da peça", attrs: { 'data-i': i } })}
          <div class="mt-2 grid grid-cols-3 gap-2">
            ${field("Quantidade", inputNum('quantity', it.quantity, { placeholder: '1', inputmode: 'numeric', attrs: { 'data-i': i } }))}
            ${field("Preço unitário", inputNum('unit_price', it.unit_price, { suffix: '€', attrs: { 'data-i': i } }))}
            ${field("Custo unitário", inputNum('unit_cost', it.unit_cost, { suffix: '€', attrs: { 'data-i': i } }))}
          </div>
        </div>`;
      }
      const keyOf = (g) => g.key;
      const cur = groups.find((g) => (it.template_id ? g.template_id === it.template_id : !g.template_id && g.item_name === it.item_name));
      const opts = [{ value: '', label: groups.length ? "Escolher uma peça em stock…" : "Nenhuma peça em stock" }, ...groups.map((g) => ({ value: keyOf(g), label: `${g.item_name} — ${fmtNum(g.qty)} em stock` }))];
      if (it.item_name && !cur) opts.push({ value: '__missing', label: `${it.item_name} — 0 em stock`, disabled: true });
      return html`<div class="rounded-2xl border border-white/[0.06] bg-ink-850 p-3">
        <div class="flex items-center gap-2">
          ${selectInput('stock_key', opts, cur ? cur.key : it.item_name ? '__missing' : '', { attrs: { 'data-i': i }, cls: 'min-w-0 flex-1' })}
          ${d.items.length > 1 ? btn('', { size: 'icon', variant: 'ghost', icon: 'X', action: 'item-remove', attrs: { 'data-i': i }, title: "Retirar" }) : ''}
        </div>
        <div class="mt-2 grid grid-cols-2 gap-2">
          ${field("Quantidade", inputNum('quantity', it.quantity, { placeholder: '1', inputmode: 'numeric', attrs: { 'data-i': i } }))}
          ${field("Preço unitário recebido", inputNum('unit_price', it.unit_price, { suffix: '€', attrs: { 'data-i': i } }))}
        </div>
        ${!cur && it.template_id ? html`<p class="mt-2 text-[12px] text-amber-300">Nenhuma peça em stock para este modelo. ${raw(`<button class="underline" data-action="produce-first" data-tid="${esc(it.template_id)}">Lançar uma produção</button>`)} ou vende-a «por medida».</p>` : ''}
      </div>`;
    })}
      <div class="flex flex-wrap gap-2">${btn("Adicionar uma peça do stock", { size: 'sm', variant: 'ghost', icon: 'Plus', action: 'item-add' })}${btn("Peça por medida", { size: 'sm', variant: 'ghost', icon: 'Sparkles', action: 'item-custom' })}</div>
    </div>`;
  };

  Modal.open({
    title: "Registar uma venda",
    subtitle: "O stock é retirado, a margem líquida calculada",
    size: 'lg',
    render: () => {
      const st = settingsOf(Store.V);
      return {
        body: html`<div class="grid gap-5 lg:grid-cols-2">
          <div class="space-y-4">
            <div><h3 class="section-title mb-2">Artigos</h3><div id="sale-items">${itemsBlock()}</div></div>
            <div><span class="label">Canal de venda</span><div class="flex flex-wrap gap-1.5">${st.sales_channels.map((c) => html`<button data-action="channel" data-value="${c.id}" aria-pressed="${d.channel === c.id}" class="chip ${d.channel === c.id ? 'chip-active' : ''}">${c.name}${toNum(c.pct) > 0 || toNum(c.fixed) > 0 ? html`<span class="text-slate-500"> · ${toNum(c.pct) > 0 ? `${fmtNum(c.pct, 1)} %` : ''}${toNum(c.pct) > 0 && toNum(c.fixed) > 0 ? ' + ' : ''}${toNum(c.fixed) > 0 ? fmtEur(c.fixed) : ''}</span>` : ''}</button>`)}</div></div>
            <div class="grid grid-cols-2 gap-3">
              ${field("Portes pagos por ti", inputNum('shipping_cost', d.shipping_cost, { suffix: '€', placeholder: '0,00' }))}
              ${field("Caixa / embalagem", inputNum('packaging_cost', d.packaging_cost, { suffix: '€', placeholder: '0,00' }))}
              ${field("Comissão da plataforma", inputNum('platform_fee', d.platform_fee, { suffix: '€', placeholder: '0,00' }), { hint: d.feeTouched ? "Introdução manual." : "Calculada segundo o canal (pode ser alterada)." })}
              ${field("Portes cobrados ao cliente", inputNum('shipping_charged', d.shipping_charged, { suffix: '€', placeholder: '0,00' }), { hint: "Somado ao recebido." })}
            </div>
            <details class="rounded-2xl border border-white/[0.06] bg-ink-850 p-3">
              <summary class="cursor-pointer list-none text-sm text-slate-300">Cliente, data e nota <span class="text-slate-500">· ${fmtDate(fromLocalInput(d.occurredAt), 'long')}</span></summary>
              <div class="mt-3 space-y-3">
                ${field("Cliente (opcional)", inputText('customer', d.customer, { placeholder: "Nome, alcunha, n.º de encomenda…" }))}
                ${field("Data e hora", html`<input class="input" type="datetime-local" name="occurredAt" value="${d.occurredAt}"/>`)}
                ${field("Nota", inputText('note', d.note, { placeholder: "Observação", maxlength: 1000 }))}
              </div>
            </details>
          </div>
          <div id="sale-summary" class="lg:sticky lg:top-0 lg:self-start">${summaryBlock()}</div>
        </div>`,
        footer: html`<div class="flex justify-end gap-2">${btn("Cancelar", { variant: 'ghost', action: 'cancel' })}${btn("Registar a venda", { variant: 'primary', icon: 'Check', action: 'submit' })}</div>`,
      };
    },
    onInput: (e, m) => {
      const el = e.target;
      const name = el.name;
      if (!name) return;
      const num = () => (el.value.trim() === '' ? null : parseNum(el.value));
      if (el.dataset.i !== undefined) {
        const it = d.items[+el.dataset.i];
        if (!it) return;
        if (name === 'stock_key') {
          if (e.type !== 'change') return;
          const g = stockGroups(Store.V).find((x) => x.key === el.value);
          if (g) {
            it.template_id = g.template_id;
            it.item_name = g.item_name;
            const price = priceFor(Store.V, g.template_id);
            if (price !== null) it.unit_price = price;
          }
          autoFee();
          m.render();
          return;
        }
        if (name === 'item_name') it.item_name = el.value;
        if (name === 'quantity') it.quantity = num();
        if (name === 'unit_price') it.unit_price = num();
        if (name === 'unit_cost') it.unit_cost = num();
      } else if (name === 'platform_fee') {
        d.platform_fee = num();
        d.feeTouched = true;
      } else if (['shipping_cost', 'packaging_cost', 'shipping_charged'].includes(name)) {
        d[name] = num();
      } else if (name === 'customer' || name === 'note' || name === 'occurredAt') {
        d[name] = el.value;
        if (name === 'occurredAt') d.dateEdited = el.value !== toLocalInput();
        return;
      }
      if (name !== 'platform_fee') {
        const before = d.platform_fee;
        autoFee();
        if (before !== d.platform_fee) {
          const feeInput = m.q('input[name="platform_fee"]');
          if (feeInput && document.activeElement !== feeInput) feeInput.value = d.platform_fee === null ? '' : String(d.platform_fee).replace('.', ',');
        }
      }
      m.update('#sale-summary', summaryBlock());
    },
    actions: {
      cancel: (el, e, m) => m.close(),
      channel: (el, e, m) => {
        d.channel = el.dataset.value;
        d.feeTouched = false;
        autoFee();
        m.render();
      },
      'item-add': (el, e, m) => {
        d.items.push({ key: uuid(), from_stock: true, template_id: null, item_name: '', quantity: 1, unit_price: null, unit_cost: null });
        m.render();
      },
      'item-custom': (el, e, m) => {
        const blank = d.items.length === 1 && !d.items[0].item_name;
        const item = { key: uuid(), from_stock: false, template_id: null, item_name: '', quantity: 1, unit_price: null, unit_cost: null };
        if (blank) d.items = [item];
        else d.items.push(item);
        m.render();
      },
      'item-remove': (el, e, m) => {
        d.items.splice(+el.dataset.i, 1);
        autoFee();
        m.render();
      },
      'produce-first': (el, e, m) => {
        m.close();
        openProductionModal({ kind: 'production', templateId: el.dataset.tid });
      },
      submit: async (el, e, m) => {
        if (d.busy) return;
        const V = Store.V;
        const items = d.items.filter((it) => String(it.item_name || '').trim());
        if (!items.length) return toast("Escolhe pelo menos uma peça para vender.", { tone: 'bad' });
        for (const it of items) {
          if (!isPieceCount(it.quantity)) return toast(`Quantidade inválida para «${it.item_name}»: ${PIECES_ERROR}`, { tone: 'bad' });
          if (!Number.isFinite(it.unit_price) || it.unit_price < 0) return toast(`Indica o preço recebido por «${it.item_name}».`, { tone: 'bad' });
          if (!it.from_stock && it.unit_cost !== null && (!Number.isFinite(it.unit_cost) || it.unit_cost < 0)) return toast("Custo unitário inválido.", { tone: 'bad' });
        }
        for (const k of ['shipping_cost', 'packaging_cost', 'platform_fee', 'shipping_charged']) {
          if (d[k] !== null && (!Number.isFinite(d[k]) || d[k] < 0)) return setFieldError(m.el, k, "Montante inválido.");
        }
        const p = planSale(V, { ...form(), items: items.map((i) => ({ ...i, id: i.key, unit_price: toNum(i.unit_price), unit_cost: toNum(i.unit_cost) })) });
        if (p.shortages.length) return toast(`Stock insuficiente para «${p.shortages[0].item_name}».`, { tone: 'bad' });
        d.busy = true;
        el.disabled = true;
        lsSet(lsKey('last_channel'), d.channel);
        // vente d'une commande : la même action livre la commande (la base fait les deux ensemble)
        const res = await Sync.enqueue('sale.record', order ? { ...p.payload, order_id: order.id } : p.payload);
        d.busy = false;
        el.disabled = false;
        if (res.state === 'confirmed') {
          const sale = Store.V.sales.get(p.payload.id);
          toast(`Margem líquida ${fmtEur(sale ? sale.net_margin : p.net)} em ${fmtEur(sale ? sale.amount : p.amount)}`, { tone: 'ok', title: "Venda registada" });
          m.close();
        } else if (res.state === 'queued') {
          toast("Sem ligação: a venda fica guardada neste aparelho e será enviada automaticamente.", { tone: 'warn', title: "À espera de envio" });
          m.close();
        } else {
          toast(res.error.message, { tone: 'bad', title: res.state === 'failed' ? "Recusada pela base de dados" : "Não guardada" });
        }
      },
    },
  });
}

      else m.render();
    },
    render: () => {
      const V = Store.V;
      const s = V.sales.get(id);
      if (!s) return html`<p class="text-sm text-slate-400">Esta venda já não existe.</p>`;
      const st = settingsOf(V);
      const items = saleItemsOf(V, s.id);
      const allocs = valuesOf(V.sale_allocations);
      const pending = V.pending.has(`sales:${s.id}`);
      return {
        body: html`<div class="space-y-4">
          <div class="flex flex-wrap items-center gap-2 text-[13px] text-slate-400">${fmtDate(s.occurred_at, 'long')} · ${badge(channelOf(st, s.channel).name, 'info')}${s.customer ? html`<span>· ${s.customer}</span>` : ''}${pending ? badge("À espera de envio", 'warn', { dot: true }) : ''}</div>
          <div class="divide-y divide-white/[0.05] rounded-2xl border border-white/[0.06]">${items.map((i) => {
            const lots = allocs.filter((a) => a.sale_item_id === i.id);
            return html`<div class="px-3 py-2.5">
              <div class="flex items-center justify-between gap-2"><span class="text-sm text-slate-100">${i.quantity} × ${i.item_name}</span><span class="font-display text-sm font-semibold tabular-nums text-slate-100">${fmtEur(i.quantity * i.unit_price)}</span></div>
              <div class="text-[12px] text-slate-500">${fmtEur(i.unit_price)} / peça · custo de produção ${fmtEur(i.cogs)}${i.from_stock ? '' : " · por medida"}</div>
              ${lots.length ? html`<div class="mt-1 text-[11px] text-slate-400">Retirado de: ${lots.map((a) => {
                const lot = V.production_stock.get(a.lot_id);
                return `${a.quantity} de ${lot ? fmtDate(lot.occurred_at, 'short') : "lote eliminado"} (${fmtEur(a.unit_cost)})`;
              }).join(', ')}</div>` : ''}
            </div>`;
          })}</div>
          <div class="rounded-2xl border border-white/[0.06] bg-ink-850 p-4">
            ${statRow("Recebido", fmtEur(s.amount), { strong: true, tone: 'text-cyan-200' })}
            ${toNum(s.shipping_charged) > 0 ? statRow("dos quais portes cobrados", fmtEur(s.shipping_charged), { tone: 'text-slate-400' }) : ''}
            ${statRow("Custo de produção", `− ${fmtEur(s.cogs)}`)}
            ${statRow("Portes pagos", `− ${fmtEur(s.shipping_cost)}`)}
            ${statRow("Embalagem", `− ${fmtEur(s.packaging_cost)}`)}
            ${statRow("Comissão", `− ${fmtEur(s.platform_fee)}`)}
            <div class="mt-2 border-t border-white/[0.06] pt-2">${statRow("Margem líquida real", fmtEur(s.net_margin), { strong: true, tone: toNum(s.net_margin) >= 0 ? 'text-neon' : 'text-rose-300' })}</div>
          </div>
          ${s.note ? html`<p class="text-[13px] text-slate-400">Nota: ${s.note}</p>` : ''}
        </div>`,
        footer: html`<div class="flex justify-between gap-2">${btn("Eliminar a venda", { variant: 'danger', icon: 'Trash2', action: 'delete' })}${btn("Fechar", { action: 'close' })}</div>`,
      };
    },
    actions: {
      close: (el, e, m) => m.close(),
      delete: async (el, e, m) => {
        const linked = valuesOf(Store.V.orders).find((o) => o.sale_id === id);
        const ok = await confirmBox({ title: "Eliminar esta venda?", message: linked ? `As peças voltam ao stock e a venda sai das estatísticas. A encomenda «${linked.item_name}» volta a ficar «pronta».` : "As peças voltam ao stock e a venda sai das estatísticas.", confirm: "Eliminar a venda" });
        if (!ok) return;
        const res = await runOp('sale.delete', { id }, { success: "Venda eliminada, peças devolvidas ao stock" });
        if (opAccepted(res)) m.close();
      },
    },
  });
}

function openProductionDetails(id) {

              <span class="h-4 w-4 shrink-0 rounded-full ring-1 ring-white/20" style="background:${safeHex(c.color_hex)}"></span>

          </div>
          <div class="rounded-2xl border border-white/[0.06] bg-ink-850 p-4">
            ${statRow("Material", fmtEur(p.material_cost))}
            ${statRow("Purga", fmtEur(p.purge_cost))}
            ${statRow("Ferragens", fmtEur(p.hardware_cost))}
            ${statRow(`Máquina (${fmtDuration(p.print_time_min_total)})`, fmtEur(p.machine_cost))}
            ${statRow(`Mão de obra (${fmtNum(p.labor_min_total)} min)`, fmtEur(p.labor_cost))}
            <div class="mt-2 border-t border-white/[0.06] pt-2">${statRow(isFail ? "Perda total" : "Custo total", fmtEur(p.total_cost), { strong: true, tone: isFail ? 'text-rose-300' : 'text-slate-50' })}</div>

/* ---------- stock déjà fabriqué ---------- */
function openAddStockModal({ templateId = null, itemName = null }) {
  const V0 = Store.V;
  // le template demandé est proposé même s'il est archivé : la liste affiche toujours celui qui recevra le stock
  const templates = valuesOf(V0.templates).filter((t) => !t.archived || t.id === templateId).sort((a, b) => a.name.localeCompare(b.name, SITE.lang));
  const t0 = templateId ? V0.templates.get(templateId) : null;
  const d = {
    mode: t0 ? 'template' : itemName ? 'free' : templates.length ? 'template' : 'free',
    templateId: t0 ? t0.id : !itemName && templates[0] ? templates[0].id : null,
    itemName: itemName || '',
    quantity: 1,
    unitCost: null,
    occurredAt: toLocalInput(),
    note: '',
    busy: false,
  };
  const defaultCost = () => {
    const t = d.templateId ? Store.V.templates.get(d.templateId) : null;
    return t ? roundDb(templateCost(Store.V, t).total, 2) : null;
  };
  d.unitCost = d.mode === 'template' ? defaultCost() : null;
  Modal.open({
    title: "Adicionar stock já fabricado",
    subtitle: "Peças já existentes: nenhum filamento é descontado",
    size: 'sm',
    render: () => ({
      body: html`<div class="space-y-4">
        ${templates.length ? segmented('mode', [{ value: 'template', label: "A partir de um modelo" }, { value: 'free', label: "Outra peça" }], d.mode, { action: 'mode', cls: 'w-full [&>button]:flex-1' }) : ''}
        ${d.mode === 'template'
          ? field("Modelo", selectInput('templateId', templates.map((t) => ({ value: t.id, label: t.archived ? `${t.name} (arquivado)` : t.name })), d.templateId))
          : field("Nome da peça", inputText('itemName', d.itemName, { placeholder: "Peça" }))}
        <div class="grid grid-cols-2 gap-3">
          ${field("Quantidade", inputNum('quantity', d.quantity, { inputmode: 'numeric', placeholder: '1' }))}
          ${field("Custo unitário", inputNum('unitCost', d.unitCost, { suffix: '€', placeholder: '0,00' }), { hint: d.mode === 'template' ? "Pré-preenchido com o custo atual." : '' })}
        </div>
        ${field("Data", html`<input class="input" type="datetime-local" name="occurredAt" value="${d.occurredAt}"/>`)}
        ${field("Nota", inputText('note', d.note, { placeholder: "Stock inicial, devolução de cliente…", maxlength: 1000 }))}
      </div>`,
      footer: html`<div class="flex justify-end gap-2">${btn("Cancelar", { variant: 'ghost', action: 'cancel' })}${btn("Adicionar ao stock", { variant: 'primary', icon: 'PackagePlus', action: 'submit' })}</div>`,
    }),
    onInput: (e, m) => {
      const el = e.target;
      if (!el.name) return;
      if (el.name === 'templateId') {
        d.templateId = el.value;
        if (e.type === 'change') {
          d.unitCost = defaultCost();
          m.render();
        }
        return;
      }
      d[el.name] = el.hasAttribute('data-num') ? (el.value.trim() === '' ? null : parseNum(el.value)) : el.value;
      if (el.name === 'occurredAt') d.dateEdited = el.value !== toLocalInput();
    },
    actions: {
      cancel: (el, e, m) => m.close(),
      mode: (el, e, m) => {
        d.mode = el.dataset.value;
        d.unitCost = d.mode === 'template' ? defaultCost() : null;
        m.render();
      },
      submit: async (el, e, m) => {
        if (d.busy) return;
        const t = d.mode === 'template' && d.templateId ? Store.V.templates.get(d.templateId) : null;
        const name = t ? t.name : String(d.itemName || '').trim();
        if (!name) return setFieldError(m.el, 'itemName', "Nome obrigatório.");
        if (!isPieceCount(d.quantity)) return setFieldError(m.el, 'quantity', PIECES_ERROR);
        const q = toNum(d.quantity);
        if (d.unitCost !== null && (!Number.isFinite(d.unitCost) || d.unitCost < 0)) return setFieldError(m.el, 'unitCost', "Custo inválido.");
        d.busy = true;
        const occurredAt = d.dateEdited ? fromLocalInput(d.occurredAt) : new Date().toISOString();
        const res = await runOp('stock.add', { id: uuid(), template_id: t ? t.id : null, item_name: name, unit_cost: roundDb(toNum(d.unitCost), 4), quantity: q, note: String(d.note || '').trim() || null, occurred_at: occurredAt }, { success: `${name}: +${fmtNum(q)} em stock` });
        d.busy = false;
        if (opAccepted(res)) m.close();
      },
    },
  });
}

// Date promise (jour sans heure) : lue comme un jour LOCAL, jamais décalée par le fuseau
function fmtDueDate(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(SITE.locale, { weekday: 'short', day: 'numeric', month: 'short' });
}

function orderDueBadge(o) {
  if (o.status !== 'todo' && o.status !== 'ready') return '';
  const n = orderDueIn(o);
  if (n === null) return '';
  if (n < 0) return badge(`Atrasada ${plural(-n, "dia", "dias")}`, 'bad', { dot: true });
  if (n === 0) return badge("Para hoje", 'warn', { dot: true });
  if (n === 1) return badge("Para amanhã", 'warn');
  return badge(`Daqui a ${plural(n, "dia", "dias")}`, n <= 3 ? 'warn' : 'off');
}

function orderRow(V, o) {
  const t = o.template_id ? V.templates.get(o.template_id) : null;
  const total = orderTotal(o);
  const stock = t ? stockForTemplate(V, t.id) : 0;
  const pending = pendingBadge(V, `orders:${o.id}`);
  const open = o.status === 'todo' || o.status === 'ready';
  return html`<div class="flex flex-col gap-3 px-3 py-3 sm:flex-row sm:items-center sm:px-4 ${open ? '' : 'opacity-70'}">
    <div class="flex min-w-0 flex-1 items-start gap-3">
      <div class="h-12 w-12 shrink-0 overflow-hidden rounded-xl bg-ink-850 p-1">${layeredThumb(t ? t.materials : [], t ? t.photo : null)}</div>
      <div class="min-w-0 flex-1">
        <div class="flex items-start gap-2">
          <div class="flex min-w-0 flex-1 flex-wrap items-center gap-x-2 gap-y-1">
            <span class="line-clamp-2 text-sm font-semibold leading-snug text-slate-100">${o.item_name} × ${fmtNum(o.quantity)}</span>
            ${orderDueBadge(o)}${open ? '' : badge(ORDER_STATUS[o.status].label, 'off')}
          </div>
          ${btn('', { size: 'iconSm', variant: 'ghost', icon: 'EllipsisVertical', action: 'order-menu', attrs: { 'data-id': o.id }, title: "Mais ações", cls: '-mr-2 -mt-1 shrink-0' })}
        </div>
        <div class="mt-0.5 flex flex-wrap gap-x-1.5 text-[12px] text-slate-500">
          <span>${o.customer || "Cliente não indicado"}</span>
          ${o.due_date ? html`<span>· para ${fmtDueDate(o.due_date)}</span>` : ''}
          ${total !== null ? html`<span>· ${fmtEur(total)}</span>` : ''}
          ${t && o.status === 'todo' ? html`<span class="${stock >= o.quantity ? 'text-neon' : ''}">· ${fmtNum(stock)} em stock</span>` : ''}
        </div>
        ${o.note ? html`<div class="mt-1 line-clamp-2 text-[12px] text-slate-400">${o.note}</div>` : ''}
        ${pending ? html`<div class="mt-1">${pending}</div>` : ''}
      </div>
    </div>
    ${open ? html`<div class="flex shrink-0 flex-wrap gap-2 sm:justify-end">
      ${o.status === 'todo' && t ? btn("Produzir", { size: 'sm', variant: 'ghost', icon: 'Printer', action: 'order-produce', attrs: { 'data-id': o.id } }) : ''}
      ${o.status === 'todo' ? btn("Pronta", { size: 'sm', variant: 'ghost', icon: 'PackageCheck', action: 'order-ready', attrs: { 'data-id': o.id } }) : ''}
      ${btn("Entregar", { size: 'sm', variant: o.status === 'ready' ? 'primary' : 'ghost', icon: 'ShoppingBag', action: 'order-deliver', attrs: { 'data-id': o.id } })}
    </div>` : ''}
  </div>`;
}

function ordersTab(V) {
  const all = valuesOf(V.orders);
  const open = openOrders(V);
  const todo = open.filter((o) => o.status === 'todo');
  const ready = open.filter((o) => o.status === 'ready');
  const done = all.filter((o) => o.status === 'delivered' || o.status === 'cancelled')
    .sort((a, b) => time(b.updated_at) - time(a.updated_at)).slice(0, 20);
  const late = open.filter((o) => (orderDueIn(o) ?? 0) < 0).length;
  const section = (title, list) => (list.length ? html`<h3 class="mb-2 mt-5 px-1 text-[12px] font-semibold uppercase tracking-wide text-slate-500">${title}</h3>
    <div class="card divide-y divide-white/[0.05] overflow-hidden">${list.map((o) => orderRow(V, o))}</div>` : '');
  return html`
    <div class="mb-1 flex flex-wrap items-center justify-between gap-2">
      <p class="text-sm text-slate-400">${open.length
        ? html`<span class="font-semibold text-slate-100">${fmtNum(open.length)}</span> ${open.length >= 2 ? "encomendas em curso" : "encomenda em curso"}${late ? html` · <span class="font-semibold text-rose-300">${plural(late, "atrasada", "atrasada")}</span>` : ''}`
        : "Nenhuma encomenda em curso"}</p>
      ${btn("Nova encomenda", { size: 'sm', variant: 'primary', icon: 'Plus', action: 'order-new' })}
    </div>
    ${all.length ? '' : emptyCard({ icon: 'ClipboardList', title: "Nenhuma encomenda", text: "Aponta aqui o que os teus clientes te pediram: peça, quantidade, preço e data prometida. Os prazos aparecem no painel.", actions: btn("Nova encomenda", { variant: 'primary', icon: 'Plus', action: 'order-new' }) })}
    ${section("Por fazer", todo)}
    ${section("Prontas a entregar", ready)}
    ${section("Entregues e canceladas (recentes)", done)}`;
}

// Tableau de bord : commandes en cours (seulement s'il y en a)
function ordersCard(V) {
  const open = openOrders(V);

  const late = open.filter((o) => (orderDueIn(o) ?? 0) < 0).length;
  const next = open[0];
  return html`<button data-action="order-tab" class="card mb-3 flex w-full flex-wrap items-center gap-3 p-4 text-left transition hover:border-white/15 ${late ? 'border-rose-500/30' : ''}">

    <span class="min-w-0 flex-1">
      <span class="block text-sm font-semibold text-slate-100">${plural(open.length, "encomenda em curso", "encomendas em curso")}${late ? html` · <span class="text-rose-300">${plural(late, "atrasada", "atrasada")}</span>` : ''}</span>
      <span class="block truncate text-[12px] text-slate-400">Próxima: ${next.item_name} × ${fmtNum(next.quantity)}${next.customer ? ` pour ${next.customer}` : ''}${next.due_date ? ` · ${fmtDueDate(next.due_date)}` : ''}</span>
    </span>
    <span class="text-slate-500">${icon('ChevronRight', 'w-5 h-5')}</span>

function openOrderModal({ order = null, templateId = null }) {
  const V0 = Store.V;
  const st0 = settingsOf(V0);
  const editing = !!order;
  const templates = valuesOf(V0.templates).filter((t) => !t.archived || (order && t.id === order.template_id)).sort((a, b) => a.name.localeCompare(b.name, SITE.lang));
  const priceFor = (tid) => {
    const t = tid ? Store.V.templates.get(tid) : null;
    return t ? templatePrice(Store.V, t).price : null;
  };
  const firstTpl = order ? order.template_id : templateId || (templates[0] && templates[0].id) || null;
  const d = order
    ? { ...pick(order, ORDER_FIELDS), mode: order.template_id ? 'template' : 'custom' }
    : {
      id: uuid(), customer: '', template_id: firstTpl, item_name: '', quantity: 1, unit_price: priceFor(firstTpl),
      due_date: '', channel: lsGet(lsKey('last_channel'), null), note: '', status: 'todo', sale_id: null, mode: firstTpl ? 'template' : 'custom',
    };
  d.busy = false;
  Modal.open({
    title: editing ? "Editar a encomenda" : "Nova encomenda",
    subtitle: "O que o cliente pediu, e para quando",
    size: 'md',
    render: () => ({
      body: html`<div class="space-y-4">
        ${field("Cliente", inputText('customer', d.customer, { placeholder: "ex. Maria (Vinted)", maxlength: 120, attrs: { autofocus: true } }))}
        ${templates.length ? segmented('mode', [{ value: 'template', label: "A partir de um modelo" }, { value: 'custom', label: "Outra peça" }], d.mode, { action: 'mode', cls: 'w-full [&>button]:flex-1' }) : ''}
        ${d.mode === 'template' && templates.length
          ? field("Peça", selectInput('template_id', templates.map((t) => ({ value: t.id, label: t.archived ? `${t.name} (arquivado)` : t.name })), d.template_id))
          : field("Peça", inputText('item_name', d.item_name, { placeholder: "ex. Figura por medida", maxlength: 120 }))}
        <div class="grid grid-cols-2 gap-3">
          ${field("Quantidade", inputNum('quantity', d.quantity, { placeholder: '1', inputmode: 'numeric' }))}
          ${field("Preço unitário combinado", inputNum('unit_price', d.unit_price, { suffix: '€', placeholder: '—' }))}
        </div>
        ${field("Para", html`<input class="input" type="date" name="due_date" value="${d.due_date || ''}"/>`, { hint: "Data prometida ao cliente (opcional)." })}
        <div><span class="label">Canal</span><div class="flex flex-wrap gap-1.5">
          <button type="button" data-action="channel" data-value="" aria-pressed="${!d.channel}" class="chip ${!d.channel ? 'chip-active' : ''}">Não indicado</button>
          ${st0.sales_channels.map((c) => html`<button type="button" data-action="channel" data-value="${c.id}" aria-pressed="${d.channel === c.id}" class="chip ${d.channel === c.id ? 'chip-active' : ''}">${c.name}</button>`)}
        </div></div>
        ${field("Nota", html`<textarea class="input h-20 py-2" name="note" maxlength="1000" placeholder="Cor, tamanho, personalização, morada…">${d.note || ''}</textarea>`)}
      </div>`,
      footer: html`<div class="flex justify-end gap-2">${btn("Cancelar", { variant: 'ghost', action: 'cancel' })}${btn(editing ? "Guardar" : "Adicionar a encomenda", { variant: 'primary', icon: 'Check', action: 'submit' })}</div>`,
    }),
    onInput: (e, m) => {
      const el = e.target;
      if (!el.name) return;
      if (el.name === 'quantity' || el.name === 'unit_price') {
        d[el.name] = el.value.trim() === '' ? null : parseNum(el.value);
        if (el.name === 'quantity') setFieldError(m.el, 'quantity', el.value.trim() && !isPieceCount(d.quantity) ? PIECES_ERROR : '');
        return;
      }
      if (el.name === 'template_id') {
        d.template_id = el.value;
        const price = priceFor(el.value);
        if (price !== null) d.unit_price = price;
        m.render();
        return;
      }
      d[el.name] = el.value;
    },
    actions: {
      cancel: (el, e, m) => m.close(),
      mode: (el, e, m) => {
        d.mode = el.dataset.value;
        if (d.mode === 'template' && !d.template_id && templates[0]) {
          d.template_id = templates[0].id;
          d.unit_price = priceFor(d.template_id);
        }
        m.render();
      },
      channel: (el, e, m) => {
        d.channel = el.dataset.value || null;
        m.render();
      },
      submit: async (el, e, m) => {
        if (d.busy) return;
        const t = d.mode === 'template' && d.template_id ? Store.V.templates.get(d.template_id) : null;
        const name = t ? t.name : String(d.item_name || '').trim();
        if (!name) return setFieldError(m.el, 'item_name', "Indica a peça encomendada.");
        if (!isPieceCount(d.quantity)) return setFieldError(m.el, 'quantity', PIECES_ERROR);
        if (toNum(d.quantity) > ORDER_MAX_QTY) return setFieldError(m.el, 'quantity', `${fmtNum(ORDER_MAX_QTY)} peças no máximo.`);
        if (d.unit_price !== null && (!Number.isFinite(d.unit_price) || d.unit_price < 0 || d.unit_price >= 1e8)) return setFieldError(m.el, 'unit_price', "Preço inválido.");
        d.busy = true;
        const fields = {
          customer: String(d.customer || '').trim().slice(0, 120),
          template_id: t ? t.id : null,
          item_name: name.slice(0, 120),
          quantity: toNum(d.quantity),
          unit_price: d.unit_price === null ? null : roundDb(d.unit_price, 2),
          due_date: d.due_date || null,
          channel: d.channel || null,
          note: String(d.note || '').trim().slice(0, 1000) || null,
        };
        // modification : seulement ces champs, JAMAIS l'état ni le lien vers la vente (une livraison faite
        // sur un autre appareil pendant que cette fenêtre était ouverte ne doit pas être défaite)
        const res = editing
          ? await runOp('order.patch', { id: d.id, fields }, { success: "Encomenda editada" })
          : await runOp('order.save', { id: d.id, ...fields, status: 'todo', sale_id: null }, { success: "Encomenda adicionada" });
        d.busy = false;
        if (opAccepted(res)) m.close();
      },
    },
  });
}

      ${row('Trash2', "Eliminar", 'm-delete', 'text-rose-300')}
      ${o.status === 'delivered' ? html`<p class="px-3 pt-2 text-[12px] text-slate-500">Entrega a anular? Elimina a venda (Stock e Vendas → Vendas): as peças voltam ao stock e a encomenda volta a ficar «pronta».</p>` : ''}

      'm-cancel': async (b, e, m) => { m.close(); await runOp('order.patch', { id: o.id, fields: { status: 'cancelled' }, from: ['todo', 'ready'] }, { success: "Encomenda cancelada" }); },
      'm-delete': async (b, e, m) => {

        if (ok) await runOp('order.delete', { id: o.id }, { success: "Encomenda eliminada" });
      },
    },
  });
};

Actions['save-settings'] = async (el) => {
  const section = document.getElementById(el.dataset.section);
  if (!section) return;
  const f = readForm(section);
  const patch = {};
  const numFields = ['machine_rate', 'labor_rate', 'filament_price_kg', 'price_coef', 'target_margin_pct', 'spool_low_g', 'spool_critical_g'];
  for (const [k, v] of Object.entries(f)) {
    if (!SETTINGS_FIELDS.includes(k)) continue;
    if (numFields.includes(k)) {
      if (!Number.isFinite(v) || v < 0) return setFieldError(section, k, "Valor inválido.");
      patch[k] = roundDb(v, k === 'machine_rate' ? 4 : k === 'price_coef' ? 3 : 2);
    } else patch[k] = typeof v === 'string' ? v.trim() : v;
  }
  if ('workshop_name' in patch) patch.workshop_name = patch.workshop_name || SITE.name;
  if ('price_coef' in patch && !(patch.price_coef > 0)) return setFieldError(section, 'price_coef', "Tem de ser superior a 0.");
  if ('target_margin_pct' in patch && patch.target_margin_pct >= 100) return setFieldError(section, 'target_margin_pct', "Tem de ser inferior a 100 %.");
  if (el.dataset.section === 's-pricing') patch.pricing_mode = App.ui.pricingDraft || settingsOf(Store.V).pricing_mode;
  if ('spool_low_g' in patch && patch.spool_critical_g > patch.spool_low_g) return setFieldError(section, 'spool_critical_g', "O limite vermelho tem de ficar abaixo do limite laranja.");
  const res = await runOp('settings.save', patch, { success: "Definições guardadas" });
  if (opAccepted(res) && el.dataset.section === 's-pricing') {
    delete App.ui.pricingDraft;
    App.saveUi();
  }
};

function channelsDraft() {
  if (!App.ui.channelsDraft) App.ui.channelsDraft = JSON.parse(JSON.stringify(settingsOf(Store.V).sales_channels));
  return App.ui.channelsDraft;
}

// Ce qui est tapé dans les champs → brouillon (avant tout réaffichage, sinon la saisie serait perdue)
function readChannelInputs() {
  const list = channelsDraft();
  const section = document.getElementById('s-channels');
  if (!section) return list;
  for (const inp of $$('[data-ch]', section)) {
    const i = +inp.dataset.ch;
    if (!list[i] || !inp.name) continue;
    if (inp.name === 'ch_name') list[i].name = inp.value.trim();
    if (inp.name === 'ch_pct') list[i].pct = inp.value.trim() === '' ? 0 : parseNum(inp.value);
    if (inp.name === 'ch_fixed') list[i].fixed = inp.value.trim() === '' ? 0 : parseNum(inp.value);
  }
  return list;
}

Actions['channel-add'] = () => {
  readChannelInputs().push({ id: `c${Date.now().toString(36)}`, name: '', pct: 0, fixed: 0 });
  App.render();
};
Actions['channel-remove'] = (el) => {
  const list = readChannelInputs();
  if (list.length <= 1) return toast("Mantém pelo menos um canal de venda.", { tone: 'warn' });
  list.splice(+el.dataset.ch, 1);
  App.render();
};
Actions['save-channels'] = async () => {
  const list = readChannelInputs();
  for (const c of list) {
    if (!c.name) return toast("Cada canal tem de ter um nome.", { tone: 'bad' });
    if (!Number.isFinite(c.pct) || c.pct < 0 || c.pct >= 100 || !Number.isFinite(c.fixed) || c.fixed < 0) return toast(`Taxas inválidas para «${c.name}».`, { tone: 'bad' });
  }
  const res = await runOp('settings.save', { sales_channels: list.map((c) => ({ id: c.id, name: c.name.slice(0, 40), pct: roundDb(c.pct, 2), fixed: roundDb(c.fixed, 2) })) }, { success: "Canais de venda guardados" });
  if (opAccepted(res)) {
    delete App.ui.channelsDraft;
    App.render();
  }
};

function openMachineModal(machine) {
  const st = settingsOf(Store.V);
  const d = machine ? { ...pick(machine, MACHINE_FIELDS) } : { id: uuid(), name: '', model: '', hourly_rate: st.machine_rate, is_default: !activeMachines(Store.V).length, archived: false };
  Modal.open({
    title: machine ? "Editar a máquina" : "Nova máquina",
    size: 'sm',
    render: () => ({
      body: html`<div class="space-y-4">
        ${field("Nome", inputText('name', d.name, { placeholder: "P1S da oficina", maxlength: 80, attrs: { autofocus: true } }))}
        ${field("Modelo", inputText('model', d.model, { placeholder: 'Bambu Lab P1S + AMS', maxlength: 80 }))}
        ${field("Custo por hora", inputNum('hourly_rate', d.hourly_rate, { suffix: '€/h' }), { hint: "Eletricidade + desgaste. Ex.: 0,15 kW × 0,25 €/kWh + desgaste ≈ 0,30 €/h." })}
        <label class="flex items-center justify-between gap-3 rounded-2xl border border-white/[0.06] bg-ink-850 p-3"><span class="text-sm text-slate-200">Máquina por defeito</span><input type="checkbox" name="is_default" class="toggle" ${d.is_default ? raw('checked') : ''}/></label>
        ${machine ? html`<label class="flex items-center justify-between gap-3 rounded-2xl border border-white/[0.06] bg-ink-850 p-3"><span class="text-sm text-slate-200">Arquivada (já não é usada)</span><input type="checkbox" name="archived" class="toggle" ${d.archived ? raw('checked') : ''}/></label>` : ''}
      </div>`,
      footer: html`<div class="flex items-center justify-between gap-2">${machine ? btn("Eliminar", { variant: 'danger', size: 'sm', icon: 'Trash2', action: 'delete' }) : html`<span></span>`}<div class="flex gap-2">${btn("Cancelar", { variant: 'ghost', action: 'cancel' })}${btn("Guardar", { variant: 'primary', icon: 'Check', action: 'submit' })}</div></div>`,
    }),
    actions: {
      cancel: (el, e, m) => m.close(),
      delete: async (el, e, m) => {
        const ok = await confirmBox({ title: "Eliminar esta máquina?", message: "Os modelos que a usavam passam para a taxa por defeito. O histórico mantém os custos já calculados.", confirm: "Eliminar" });
        if (!ok) return;
        const res = await runOp('machine.delete', { id: machine.id }, { success: "Máquina eliminada" });
        if (opAccepted(res)) m.close();
      },
      submit: async (el, e, m) => {
        const f = readForm(m.el);
        if (!String(f.name || '').trim()) return setFieldError(m.el, 'name', "Nome obrigatório.");
        if (!Number.isFinite(f.hourly_rate) || f.hourly_rate < 0) return setFieldError(m.el, 'hourly_rate', "Custo inválido.");
        const payload = { id: d.id, name: f.name.trim(), model: String(f.model || '').trim() || null, hourly_rate: roundDb(f.hourly_rate, 4), is_default: !!f.is_default, archived: !!f.archived };
        const res = await runOp('machine.save', payload, { success: "Máquina guardada" });
        if (opAccepted(res)) m.close();
      },
    },
  });
}

function b64urlDecode(str) {
  const s = String(str).replace(/-/g, '+').replace(/_/g, '/');
  return decodeURIComponent(escape(atob(s + '='.repeat((4 - (s.length % 4)) % 4))));
}

/* ==== 74-pdf.js ==== */
/* =============================================================================
   PDF fait maison, sans bibliothèque : texte (Helvetica), traits, rectangles,
   cercles et QR codes, sur des pages A4.
   Pourquoi : sur iPhone, dans l'appli installée sur l'écran d'accueil,
   window.print() ne fait RIEN. Un vrai fichier PDF passe par la feuille de
   partage (Imprimer, Enregistrer dans Fichiers, WhatsApp…) et marche hors-ligne.
   Coordonnées : en points (1/72 de pouce), depuis le HAUT à gauche de la page.
   ============================================================================= */

const MM = 72 / 25.4;
const A4_W = 595.28;
const A4_H = 841.89;

// Largeurs des polices standard Helvetica et Helvetica-Bold (millièmes du corps), caractères 32 à 126
const HELV_W = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556,
  278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722,
  667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556,
  333, 500, 278, 556, 500, 722, 500, 500, 500, 334, 260, 334, 584];
const HELV_B = [278, 333, 474, 556, 556, 889, 722, 238, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556,
  333, 333, 584, 584, 584, 611, 975, 722, 722, 722, 722, 667, 611, 778, 722, 278, 556, 722, 611, 833, 722, 778, 667, 778, 722, 667, 611, 722,
  667, 944, 667, 667, 611, 333, 278, 333, 584, 556, 333, 556, 611, 556, 611, 556, 333, 611, 611, 278, 278, 556, 278, 889, 611, 611, 611, 611,
  389, 556, 333, 611, 556, 778, 556, 556, 500, 389, 280, 389, 584];
// Caractères 128 à 255 qui ne sont pas des lettres accentuées : [normal, gras]
const HELV_HIGH = {
  0x80: [556, 556], 0x82: [222, 278], 0x83: [556, 556], 0x84: [333, 500], 0x85: [1000, 1000], 0x86: [556, 556], 0x87: [556, 556], 0x88: [333, 333],
  0x89: [1000, 1000], 0x8b: [333, 333], 0x8c: [1000, 1000], 0x91: [222, 278], 0x92: [222, 278], 0x93: [333, 500], 0x94: [333, 500], 0x95: [350, 350],
  0x96: [556, 556], 0x97: [1000, 1000], 0x98: [333, 333], 0x99: [1000, 1000], 0x9b: [333, 333], 0x9c: [944, 944], 0xa0: [278, 278], 0xa1: [333, 333],
  0xa6: [260, 280], 0xa7: [556, 556], 0xa8: [333, 333], 0xa9: [737, 737], 0xaa: [370, 370], 0xab: [556, 556], 0xac: [584, 584], 0xad: [333, 333],
  0xae: [737, 737], 0xaf: [333, 333], 0xb0: [400, 400], 0xb1: [584, 584], 0xb2: [333, 333], 0xb3: [333, 333], 0xb4: [333, 333], 0xb5: [556, 611],
  0xb6: [537, 556], 0xb7: [278, 278], 0xb8: [333, 333], 0xb9: [333, 333], 0xba: [365, 365], 0xbb: [556, 556], 0xbc: [834, 834], 0xbd: [834, 834],
  0xbe: [834, 834], 0xbf: [611, 611], 0xc6: [1000, 1000], 0xd0: [722, 722], 0xd7: [584, 584], 0xd8: [778, 778], 0xde: [667, 667], 0xdf: [611, 611],
  0xe6: [889, 889], 0xf0: [556, 611], 0xf7: [584, 584], 0xf8: [611, 611], 0xfe: [556, 611],
};
// Caractères hors Latin-1 présents dans l'encodage WinAnsi des polices standard, et équivalents
const WIN_ANSI = {
  0x20ac: 0x80, 0x201a: 0x82, 0x0192: 0x83, 0x201e: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02c6: 0x88, 0x2030: 0x89, 0x0160: 0x8a,
  0x2039: 0x8b, 0x0152: 0x8c, 0x017d: 0x8e, 0x2018: 0x91, 0x2019: 0x92, 0x201c: 0x93, 0x201d: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97,
  0x02dc: 0x98, 0x2122: 0x99, 0x0161: 0x9a, 0x203a: 0x9b, 0x0153: 0x9c, 0x017e: 0x9e, 0x0178: 0x9f,
  // espaces fines (séparateur des milliers en français : « 1 234,00 € ») et signe moins typographique
  0x202f: 0xa0, 0x2009: 0xa0, 0x2007: 0xa0, 0x2212: 0x2d,
};

// Texte → codes WinAnsi ; ce que les polices standard ne savent pas écrire (émojis…) devient « ? »
function pdfChars(str) {
  const out = [];
  for (const ch of String(str ?? '').normalize('NFC')) {
    const cp = ch.codePointAt(0);
    let b;
    if (cp >= 32 && cp < 127) b = cp;
    else if (cp >= 0xa0 && cp <= 0xff) b = cp;
    else if (WIN_ANSI[cp] !== undefined) b = WIN_ANSI[cp];
    else if (cp === 9 || cp === 10 || cp === 13) b = 32;
    else if (/[\p{M}\p{Cf}]/u.test(ch)) continue; // accent isolé, sélecteur de variante d'émoji, jointure
    else b = 63;
    out.push({ b, ch });
  }
  return out;
}

function pdfCharWidth(c, bold) {
  const { b } = c;
  if (b < 127) return (bold ? HELV_B : HELV_W)[b - 32] || 556;
  if (HELV_HIGH[b]) return HELV_HIGH[b][bold ? 1 : 0];
  const base = c.ch.normalize('NFD').charCodeAt(0); // lettre accentuée : largeur de la lettre de base
  return base >= 32 && base < 127 ? (bold ? HELV_B : HELV_W)[base - 32] : 556;
}

const pdfWidth = (str, size = 10, bold = false) => (pdfChars(str).reduce((w, c) => w + pdfCharWidth(c, bold), 0) * size) / 1000;

// Coupe le texte avec « … » pour qu'il tienne dans la largeur
function pdfFit(str, maxWidth, size = 10, bold = false) {
  const s = String(str ?? '');
  if (!(maxWidth > 0) || pdfWidth(s, size, bold) <= maxWidth) return s;
  const chars = [...s];
  const cut = (n) => `${chars.slice(0, n).join('').trimEnd()}…`;
  // plus long début qui tient avec « … » (recherche par moitiés)
  let lo = 0;
  let hi = chars.length - 1;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (pdfWidth(cut(mid), size, bold) <= maxWidth) lo = mid;
    else hi = mid - 1;
  }
  if (lo > 0) return cut(lo);
  return pdfWidth('…', size, bold) <= maxWidth ? '…' : '';
}

// Découpe en lignes (au plus maxLines, la dernière finit par « … » si le texte déborde)
function pdfWrap(str, maxWidth, size = 10, bold = false, maxLines = 99) {
  const lines = [];
  let cur = '';
  // typographie française : « guillemets » et : ; ! ? restent collés à leur mot (espace insécable)
  // (espaces ordinaires seulement : \s avalerait aussi les insécables des montants « 1 234,56 € »)
  const text = String(str ?? '').replace(/[ \t\r\n\f\v]+/g, ' ').replace(/^ | $/g, '').replace(/« /g, '«\u00a0').replace(/ ([»:;!?])/g, '\u00a0$1');
  for (const word of text.split(' ')) {
    const cand = cur ? `${cur} ${word}` : word;
    if (pdfWidth(cand, size, bold) <= maxWidth) {
      cur = cand;
      continue;
    }
    if (cur) lines.push(cur);
    // mot plus long que la ligne : coupé net (au moins un caractère par ligne, donc la boucle finit)
    let chars = [...word];
    while (chars.length > 1 && pdfWidth(chars.join(''), size, bold) > maxWidth) {
      let n = chars.length - 1;
      while (n > 1 && pdfWidth(chars.slice(0, n).join(''), size, bold) > maxWidth) n--;
      lines.push(chars.slice(0, n).join(''));
      chars = chars.slice(n);
    }
    cur = chars.join('');
  }
  if (cur) lines.push(cur);
  if (lines.length <= maxLines) return lines.length ? lines : [''];
  const kept = lines.slice(0, maxLines);
  kept[maxLines - 1] = pdfFit(`${kept[maxLines - 1]} ${lines.slice(maxLines).join(' ')}`, maxWidth, size, bold);
  return kept;
}

// Chaîne PDF en ASCII pur : parenthèses et barre oblique échappées, le reste en octal
const pdfString = (chars) => chars.map(({ b }) => (b === 0x28 || b === 0x29 || b === 0x5c ? `\\${String.fromCharCode(b)}` : b < 32 || b > 126 ? `\\${b.toString(8).padStart(3, '0')}` : String.fromCharCode(b))).join('');

// Métadonnées (titre) : UTF-16 en hexadécimal, lisible par tous les lecteurs
const pdfHexText = (str) => `<FEFF${[...String(str ?? '')].map((ch) => {
  const cp = ch.codePointAt(0);
  const units = cp > 0xffff ? [0xd800 + ((cp - 0x10000) >> 10), 0xdc00 + ((cp - 0x10000) & 0x3ff)] : [cp];
  return units.map((u) => u.toString(16).toUpperCase().padStart(4, '0')).join('');
}).join('')}>`;

const pdfNum = (v) => {
  const r = Math.round(toNum(v) * 100) / 100;
  return Object.is(r, -0) ? '0' : String(r);
};
function pdfRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  const n = m ? parseInt(m[1], 16) : 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((c) => String(Math.round((c / 255) * 1000) / 1000)).join(' ');
}

function pdfDocument(title = '') {
  const pages = [];
  let ops = null;
  const H = A4_H;
  const K = 0.5523; // arcs de cercle en courbes de Bézier
  const style = ({ fill = null, stroke = null, width = 0.5, dash = null }) => [
    fill ? `${pdfRgb(fill)} rg` : '',
    stroke ? `${pdfRgb(stroke)} RG ${pdfNum(width)} w` : '',
    stroke && dash ? `[${dash.map(pdfNum).join(' ')}] 0 d` : '',
  ].filter(Boolean).join(' ');
  const paint = ({ fill, stroke }) => (fill && stroke ? 'B' : fill ? 'f' : 'S');

  const doc = {
    W: A4_W,
    H: A4_H,
    get pageCount() {
      return pages.length;
    },
    page() {
      ops = [];
      pages.push(ops);
      return doc;
    },
    // revient sur une page déjà faite (numéros de page écrits à la fin)
    usePage(i) {
      ops = pages[i];
      return doc;
    },
    // y = ligne de base du texte ; renvoie la largeur écrite
    text(str, x, y, { size = 10, bold = false, color = '#111827', align = 'left', maxWidth = 0 } = {}) {
      const s = maxWidth ? pdfFit(str, maxWidth, size, bold) : String(str ?? '');
      const chars = pdfChars(s);
      if (!chars.length) return 0;
      const w = (chars.reduce((acc, c) => acc + pdfCharWidth(c, bold), 0) * size) / 1000;
      const tx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
      ops.push(`BT /${bold ? 'F2' : 'F1'} ${pdfNum(size)} Tf ${pdfRgb(color)} rg ${pdfNum(tx)} ${pdfNum(H - y)} Td (${pdfString(chars)}) Tj ET`);
      return w;
    },
    line(x1, y1, x2, y2, { color = '#e5e7eb', width = 0.5, dash = null } = {}) {
      ops.push(`q ${style({ stroke: color, width, dash })} ${pdfNum(x1)} ${pdfNum(H - y1)} m ${pdfNum(x2)} ${pdfNum(H - y2)} l S Q`);
      return doc;
    },
    rect(x, y, w, h, o = {}) {
      const r = Math.min(toNum(o.radius), w / 2, h / 2);
      const x0 = x;
      const y0 = H - y - h;
      const x1 = x + w;
      const y1 = H - y;
      let path;
      if (r > 0) {
        const k = r * K;
        const p = (...v) => v.map(pdfNum).join(' ');
        path = [`${p(x0 + r, y0)} m`, `${p(x1 - r, y0)} l`, `${p(x1 - r + k, y0, x1, y0 + r - k, x1, y0 + r)} c`, `${p(x1, y1 - r)} l`,
          `${p(x1, y1 - r + k, x1 - r + k, y1, x1 - r, y1)} c`, `${p(x0 + r, y1)} l`, `${p(x0 + r - k, y1, x0, y1 - r + k, x0, y1 - r)} c`,
          `${p(x0, y0 + r)} l`, `${p(x0, y0 + r - k, x0 + r - k, y0, x0 + r, y0)} c`, 'h'].join(' ');
      } else {
        path = `${pdfNum(x0)} ${pdfNum(y0)} ${pdfNum(w)} ${pdfNum(h)} re`;
      }
      ops.push(`q ${style(o)} ${path} ${paint(o)} Q`);
      return doc;
    },
    circle(cx, cy, r, o = {}) {
      const y = H - cy;
      const k = r * K;
      const p = (...v) => v.map(pdfNum).join(' ');
      ops.push(`q ${style(o)} ${p(cx + r, y)} m ${p(cx + r, y + k, cx + k, y + r, cx, y + r)} c ${p(cx - k, y + r, cx - r, y + k, cx - r, y)} c ${p(cx - r, y - k, cx - k, y - r, cx, y - r)} c ${p(cx + k, y - r, cx + r, y - k, cx + r, y)} c h ${paint(o)} Q`);
      return doc;
    },
    // QR code (bibliothèque qrcode-generator) : carrés noirs, regroupés par tronçons de ligne
    qr(code, x, y, size) {
      const n = code.getModuleCount();
      const cell = size / n;
      const parts = [];
      for (let r = 0; r < n; r++) {
        let c = 0;
        while (c < n) {
          if (!code.isDark(r, c)) {
            c++;
            continue;
          }
          let e = c;
          while (e < n && code.isDark(r, e)) e++;
          // léger chevauchement vertical : pas de fines lignes blanches entre deux rangées à l'écran
          parts.push(`${pdfNum(x + c * cell)} ${pdfNum(H - y - (r + 1) * cell)} ${pdfNum((e - c) * cell)} ${pdfNum(cell + 0.05)} re`);
          c = e;
        }
      }
      if (parts.length) ops.push(`q 0 0 0 rg\n${parts.join('\n')}\nf Q`);
      return doc;
    },
    // Fichier final (ASCII pur : la longueur en caractères est la longueur en octets)
    output() {
      if (!pages.length) doc.page();
      const objs = [];
      const add = (body) => objs.push(body);
      const catalog = add(null);
      const tree = add(null);
      const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const d = new Date();
      const stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
      const info = add(`<< /Title ${pdfHexText(title)} /Producer (${pdfString(pdfChars(SITE.name))}) /CreationDate (D:${stamp}) >>`);
      const kids = pages.map((p) => {
        const stream = p.join('\n');
        const content = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
        return add(`<< /Type /Page /Parent ${tree} 0 R /MediaBox [0 0 ${pdfNum(A4_W)} ${pdfNum(A4_H)}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${content} 0 R >>`);
      });
      objs[catalog - 1] = `<< /Type /Catalog /Pages ${tree} 0 R >>`;
      objs[tree - 1] = `<< /Type /Pages /Kids [${kids.map((k) => `${k} 0 R`).join(' ')}] /Count ${kids.length} >>`;
      let out = '%PDF-1.4\n';
      const offsets = objs.map((body, i) => {
        const at = out.length;
        out += `${i + 1} 0 obj\n${body}\nendobj\n`;
        return at;
      });
      const xref = out.length;
      out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n${offsets.map((o) => `${String(o).padStart(10, '0')} 00000 n \n`).join('')}`;
      out += `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      return out;
    },
  };
  return doc;
}

/* ==== 75-print.js ==== */
/* =============================================================================
   Impressions : bilan du mois et étiquettes QR des bobines (scannées : la pesée
   de la bobine s'ouvre directement).
   Deux sorties : un vrai fichier PDF (marche partout, même sur iPhone en appli
   installée, et hors-ligne) et l'impression directe du navigateur quand elle existe.
   ============================================================================= */

function monthRange(ym) {
  const m = String(ym || '').match(/^(\d{4})-(\d{2})$/);
  const now = new Date();
  const y = m ? +m[1] : now.getFullYear();
  const mo = m ? +m[2] - 1 : now.getMonth();
  const start = new Date(y, mo, 1);
  return { start, end: new Date(y, mo + 1, 1), label: `${MONTHS_LONG[start.getMonth()]} ${start.getFullYear()}`, ym: `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}` };
}
const shiftMonth = (ym, delta) => {
  const r = monthRange(ym);
  const d = new Date(r.start.getFullYear(), r.start.getMonth() + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};
// « 2026-09-12 » → « 12 sept. 2026 »
const fmtPlainDate = (s) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  return m && +m[2] >= 1 && +m[2] <= 12 ? `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}` : '';
};

// Livraison d'une commande : la date de SA vente (retoucher la commande plus tard ne la déplace pas)
function orderDeliveredAt(V, o) {
  const s = o.sale_id ? V.sales.get(o.sale_id) : null;
  return s ? s.occurred_at : o.updated_at;
}

// Données du bilan d'un mois (mêmes calculs que le tableau de bord)
function monthReport(V, ym, now = new Date()) {
  const range = monthRange(ym);
  const st = settingsOf(V);
  const stats = computeStats(V, range);
  const sales = valuesOf(V.sales).filter((s) => inRange(s.occurred_at, range)).sort((a, b) => time(a.occurred_at) - time(b.occurred_at));
  const prods = valuesOf(V.productions).filter((p) => inRange(p.occurred_at, range)).sort((a, b) => time(a.occurred_at) - time(b.occurred_at));
  const spools = valuesOf(V.spools).filter((s) => {
    const d = s.purchased_at ? new Date(`${s.purchased_at}T12:00:00`) : new Date(s.created_at);
    return !Number.isNaN(d.getTime()) && d >= range.start && d < range.end;
  });
  const delivered = valuesOf(V.orders).filter((o) => o.status === 'delivered' && inRange(orderDeliveredAt(V, o), range)).length;
  return {
    range, st, stats, sales, prods, spools, delivered,
    // commandes en cours : c'est l'état d'AUJOURD'HUI, sans objet pour un autre mois
    openOrders: now >= range.start && now < range.end ? openOrders(V, now).length : null,
    spoolSpend: sum(spools, (s) => s.price),
    tops: topProducts(V, range, 8),
  };
}

function reportKpis(r) {
  const s = r.stats;
  return [
    ["Faturação", fmtEur(s.revenue)],
    ["Custos", fmtEur(s.costs)],
    ["Lucro líquido", fmtEur(s.net)],
    ["Margem", fmtPct(s.marginRate)],
    ["Vendas", fmtNum(s.salesCount)],
    ["Peças vendidas", fmtNum(s.piecesSold)],
    ["Peças produzidas", fmtNum(s.piecesMade)],
    ["Impressões falhadas", `${fmtNum(s.piecesFailed)} · ${fmtEur(s.failureLoss)}`],
    ["Filamento usado", fmtKg(s.gramsTotal)],
    ["Compras de bobinas", fmtEur(r.spoolSpend)],
    ["Encomendas entregues", fmtNum(r.delivered)],
    ...(r.openOrders === null ? [] : [["Encomendas em curso", fmtNum(r.openOrders)]]),
  ];
}

// Tableaux du bilan, communs à l'aperçu et au PDF. Colonnes : [titre, largeur relative, 'num' | 'wrap']
function reportTables(V, r) {
  const s = r.stats;
  const fees = (x) => toNum(x.shipping_cost) + toNum(x.packaging_cost) + toNum(x.platform_fee);
  return [
    {

function reportHtml(V, r) {
  const kpi = ([label, value]) => html`<div class="pr-kpi"><span>${label}</span><b>${value}</b></div>`;
  const cell = (t, i, v) => html`<td class="${t.cols[i][2] === 'num' ? 'num' : ''}">${v}</td>`;
  const table = (t) => {
    if (!t.rows.length) return t.empty ? html`<h2>${t.title}</h2><p class="pr-empty">${t.empty}</p>` : '';
    return html`<h2>${t.title}</h2><table class="pr-table"><thead><tr>${t.cols.map((c) => html`<th class="${c[2] === 'num' ? 'num' : ''}">${c[0]}</th>`)}</tr></thead><tbody>
      ${t.rows.map((row) => html`<tr>${row.map((v, i) => cell(t, i, v))}</tr>`)}
      ${t.total ? html`<tr class="pr-total">${t.total.map((v, i) => cell(t, i, v))}</tr>` : ''}
    </tbody></table>`;
  };
  return html`<div class="pr-sheet">
    <div class="pr-head"><div><h1>Balanço de ${r.range.label}</h1><p>${r.st.workshop_name} · impresso a ${fmtDate(new Date().toISOString(), 'long')}</p></div></div>
